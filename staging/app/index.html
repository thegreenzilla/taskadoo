<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskadoo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#262261">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taskadoo">
<script>
  // Assembler app link (staging/assembler/ → ?app=asm): its own home-screen icon and name
  window.ASM_APP = /[?&]app=asm\b/.test(location.search);
  if (window.ASM_APP) {
    document.querySelector('link[rel=manifest]').href = 'manifest-assembler.webmanifest';
    document.querySelector('meta[name=apple-mobile-web-app-title]').content = 'Assembler';
    document.title = 'Taskadoo for assemblers';
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#262261; --blue:#0E77BA; --blue-soft:#E2F0FA; --bg:#ECE9E2; --card:#fff; --soft:#FAF8F3;
  --line:#EFEBE3; --line2:#E0DBD1; --text:#55505F; --muted:#8E8896; --faint:#A39EAC;
  --green:#15875A; --green-soft:#DFF1E9; --orange:#E8772E; --orange-soft:#FAE6D5; --red:#C62828; --red-soft:#FCE4E4;
  --radius:20px; --shadow:0 1px 2px rgba(38,34,97,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:500 15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue)}
h1,h2,h3{color:var(--ink);margin:0;letter-spacing:-.015em}
h1{letter-spacing:-.025em}
h1{font-size:26px;font-weight:700} h2{font-size:20px;font-weight:700} h3{font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;border:1px solid var(--line2);background:var(--soft);border-radius:12px;padding:11px 12px;font-weight:600;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff}
textarea{min-height:80px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.green{background:var(--green)}
.btn.red{background:#fff;color:var(--red);border:1px solid #F1C4C4}
.btn.small{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.b{font-weight:700;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.grid2>.card,.grid2>.card+.card{margin-top:0}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.orange{background:var(--orange-soft);color:var(--orange);border-color:transparent}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.ink{background:var(--ink);color:#fff;border-color:transparent}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pill{border:1px solid #E0DBD1;background:#FAF8F3;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;color:#6B6577}
.pill.on{background:#EAF4FB;color:var(--blue);border-color:var(--blue)}
.pill .n{opacity:.6;margin-left:4px}
/* layout */
.top{position:sticky;top:0;z-index:20;background:rgba(236,233,226,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.top img.logo{height:26px;display:block}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.nav a{padding:8px 12px;border-radius:10px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap;font-size:14.5px}
.nav a.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;border:0}
.main{max-width:1200px;margin:0 auto;padding:20px 16px 110px}
.narrow{max-width:640px;margin:0 auto}
.bottom{display:none}
.menu{position:absolute;right:16px;top:54px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;min-width:220px;z-index:30}
.menu .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none}
.menu .mi:hover{background:var(--soft)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.sticky{position:sticky;top:76px}
.backsm{display:none;margin-bottom:10px}
.list>.li{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;color:inherit;text-decoration:none}
.list>.li+.li{margin-top:8px}
.list>.li.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv>dt{color:var(--muted);font-weight:700} .kv>dd{margin:0;color:var(--ink);font-weight:700;word-break:break-word}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:7px 0;border-bottom:1px dashed var(--line2);vertical-align:top}
.lines td.r{text-align:right;white-space:nowrap;font-weight:700;color:var(--ink)}
.lines tr:last-child td{border-bottom:0}
.tot{display:flex;justify-content:space-between;font-weight:700;color:var(--ink);font-size:17px;padding-top:10px;border-top:2px solid var(--ink);margin-top:6px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:6px}
.notice{border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--blue-soft);color:var(--ink)}
.notice.warn{background:var(--orange-soft)} .notice.ok{background:var(--green-soft)} .notice.bad{background:var(--red-soft);color:var(--red)}
/* catalogue */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.item .em{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:24px}
.item .nm{font-weight:700;color:var(--ink);line-height:1.25}
.item .fee{font-weight:700;color:var(--ink);font-size:17px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.qty button{border:0;background:none;width:34px;height:34px;font-weight:700;font-size:18px;cursor:pointer;color:var(--ink)}
.qty span{min-width:26px;text-align:center;font-weight:700;color:var(--ink)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--ink);color:#fff}
.cartbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.cartbar .btn{background:#fff;color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:1px solid #E0DBD1;background:#FAF8F3;border-radius:12px;padding:11px 8px;font-weight:700;font-size:12.5px;cursor:pointer;color:#55505F}
.slot.on{background:#EAF4FB;color:var(--blue);border-color:var(--blue)}
/* timeline */
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps i{flex:1;height:6px;border-radius:4px;background:var(--line2)}
.steps i.on{background:var(--green)}
.events{font-size:13px;color:var(--muted)}
.events div{padding:4px 0;border-bottom:1px solid var(--line)}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photos a,.photos .ph{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.sig{width:100%;height:180px;border:2px dashed var(--line2);border-radius:14px;background:#fff;touch-action:none;display:block}
.big{font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.money{font-weight:700;color:var(--green)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:8px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input,.tbl select{padding:7px 8px;border-radius:9px}
.scroll{overflow-x:auto}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth .card{width:100%;max-width:420px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs2 button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.choice{display:grid;gap:8px;margin-bottom:12px}
.choice button{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;font-weight:700;color:var(--ink)}
.choice button.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.choice small{display:block;font-weight:600;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--red)}
.stagebadge{position:fixed;left:10px;bottom:10px;z-index:70;background:#d32f2f;color:#fff;font:800 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.08em;padding:5px 10px;border-radius:999px;pointer-events:none}
.offer{border:2px solid var(--orange);border-radius:18px;background:#fff;padding:16px}
.timer{font-size:40px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* assembler app – phone layout from the design (Apps-2 · Assembler app) */
body.is-asm{background:#E4E0D7;font-family:Nunito,GothamRounded,'Segoe UI',system-ui,sans-serif}
.asm{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:clip}
@media(min-width:620px){.asm{margin:24px auto;min-height:calc(100vh - 48px);border:8px solid #262261;border-radius:40px;box-shadow:0 30px 80px rgba(38,34,97,.22)}}
.asm-top{background:#262261;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 22px 18px}
.asm-top .hi{display:flex;align-items:center;justify-content:space-between}
.asm-top .hi small{display:block;font-size:12px;font-weight:600;color:#8F88AE}.asm-top .hi b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.asm-top .hi .r{text-align:right}.asm-top .hi .r b{color:#FF8C3E}
.asm-top .onbtn{margin-top:14px;padding:14px}
.asm-main{flex:1;padding:18px 20px 24px}
.asm-tabs{position:sticky;bottom:0;z-index:30;background:#fff;border-top:1px solid #E8E3DA;padding:9px 12px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.asm-tabs a{padding:10px 4px;border-radius:11px;text-align:center;font-weight:700;font-size:12px;color:#A39EAC;text-decoration:none;position:relative}
.asm-tabs a.on{background:#E2F0FA;color:#0E77BA}.asm-tabs .dot{position:absolute;top:6px;right:14px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.asm .narrow{max-width:none}
.asm .card{border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:none}
.asm h1{font-size:20px}.asm h2{font-size:17px}
.asm .kpis{margin:0 0 16px}.asm .kpis>div{text-align:center;padding:12px 10px;border-radius:15px;border-color:#EFEBE3}
.asm .kpis b{font-size:19px;letter-spacing:-.02em}.asm .kpis span{font-size:10.5px;line-height:1.3;display:block;margin-top:3px}
.asm .pills{gap:7px;margin-bottom:6px}.asm .pills .pill{flex:1;text-align:center;border-radius:11px;padding:9px;font-size:12.5px;background:#fff;color:#8E8896}
.asm .pills .pill.on{background:#EAF4FB;color:#0E77BA}
.asm .grp{margin:16px 0 9px}.asm .grp h3{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A39EAC}
.asm .list>.li{border-radius:18px;padding:15px 16px;border-color:#EFEBE3;border-left:4px solid #BCDCF1}
.asm .list>.li+.li{margin-top:9px}.asm .list>.li.done{border-left-color:#BFE3D2}.asm .list>.li.wait{border-left-color:#F0C98A}
.asm .offer{border:2px solid #FF8C3E;border-radius:20px;padding:18px;box-shadow:0 14px 34px rgba(255,140,62,.18);margin-bottom:16px}
.asm .src{font-size:11px;font-weight:700;letter-spacing:.06em;color:#0E77BA;text-transform:uppercase}
.asm .code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#A39EAC}
.stepline{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.stepline b{font-size:11px;font-weight:700;letter-spacing:.08em;color:#0E77BA}
.stepbar{height:5px;background:#F1EFE8;border-radius:5px;overflow:hidden;margin-bottom:16px}.stepbar i{display:block;height:100%;background:#0E77BA;border-radius:5px}
.acts3{display:flex;gap:9px;margin-top:13px}.acts3 a{flex:1;border:1px solid #E0DBD1;background:#FAF8F3;color:#262261;font-weight:700;font-size:13px;padding:11px 6px;border-radius:12px;text-align:center;text-decoration:none}
.asm .btn.block{padding:15px;border-radius:14px;font-size:15px}
.asm .btn.block:not(.ghost):not(.soft):not(.red):not(.green){box-shadow:0 10px 22px rgba(14,119,186,.26)}
/* assembler app */
.onbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;margin-top:14px;border-radius:14px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14.5px;background:rgba(255,255,255,.08);color:#B7B1CC}
.onbtn i{width:9px;height:9px;border-radius:50%;background:#8F88AE}
.onbtn.on{background:rgba(78,227,155,.16);color:#4EE39B}.onbtn.on i{background:#4EE39B;box-shadow:0 0 0 4px rgba(78,227,155,.2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.kpis b{display:block;font-size:18px}.kpis span{font-size:11.5px;color:var(--muted);font-weight:600}
.crew{margin-top:8px;padding:7px 10px;border-radius:10px;font-size:12.5px;font-weight:600}
.crew.solo{background:var(--soft);color:var(--muted)}.crew.ok{background:var(--green-soft);color:var(--green)}.crew.wait{background:var(--orange-soft);color:#8A5A12}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px}.grp h3{margin:0}
.prep{margin:6px 0 14px;padding-left:18px;font-size:14px;line-height:1.55}.prep li{margin-bottom:4px}
.chk{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;font-weight:600;font-size:14px;background:#fff}
.chk input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--green)}
.addon{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:14px;cursor:pointer;font:inherit;border:1px solid var(--line);background:#fff;margin-bottom:6px;color:var(--text)}
.addon .bx{width:20px;height:20px;flex:none;border-radius:7px;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.addon.on{border-color:var(--blue);background:var(--blue-soft)}.addon.on .bx{background:var(--blue)}
.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.shot{aspect-ratio:4/3;border-radius:14px;border:2px dashed var(--line);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;text-align:center;padding:8px;font-size:13px}
.shot.ok{border:1px solid var(--green);background:var(--green-soft);color:var(--green)}.shot b{font-size:13.5px}.shot small{color:var(--muted);font-size:11.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid transparent;font:inherit;font-weight:700;font-size:13px;cursor:pointer;background:var(--green-soft);color:var(--green);padding:0;position:relative}
.cal button.booked{background:var(--blue);color:#fff}.cal button.time_off{background:var(--red-soft);color:var(--red)}
.cal button.shift{background:var(--orange-soft);color:#8A5A12}.cal button.day_off{background:var(--soft);color:var(--muted)}
.cal button.past{opacity:.45;cursor:default}.cal button.today{border-color:var(--ink)}
.cal button small{position:absolute;bottom:2px;left:0;right:0;font-size:9px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wk{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;align-items:center}.wk .tm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.wk .tm input{width:auto}
.bars{display:flex;align-items:flex-end;gap:8px;height:80px;margin-top:12px}.bars div{flex:1;text-align:center}
.bars i{display:block;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.28);margin-bottom:4px}.bars i.now{background:#FF8C3E}.bars span{font-size:11px;opacity:.7}
.meter{height:7px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;border-radius:9px;background:var(--green)}
.ck{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin:0 6px 6px 0;font-size:13.5px;cursor:pointer;background:#fff}
.ck input{width:auto;margin:0}
.stars{display:flex;gap:6px;margin:8px 0 12px}.stars button{font-size:30px;line-height:1;border:0;background:none;cursor:pointer;color:#D8D2C6;padding:2px}.stars button.on{color:#F5A623}
/* customer site (matches the landing page design) */
.stop{position:sticky;top:0;z-index:60;background:rgba(236,233,226,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.06)}
.stop-in{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:24px;height:66px}
.stop img{height:28px;width:auto;display:block}
.snav{display:flex;align-items:center;gap:24px;flex:1;justify-content:center;white-space:nowrap}
.snav a,.slink{color:#46414F;font-weight:700;font-size:15px;text-decoration:none}
.snav a:hover,.slink:hover{color:var(--blue)}
.sright{display:flex;align-items:center;gap:12px;flex:none;white-space:nowrap}
.sbiz{border:1px solid var(--ink);color:var(--ink);background:transparent;font-weight:700;font-size:14.5px;padding:9px 16px;border-radius:999px;text-decoration:none}

<body>
<div id="app"><div class="auth"><div class="muted">Loading…</div></div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ───────────── Data access (all Supabase calls live here) ───────────── */
const CFG = window.TASKADOO_CONFIG || {};
const sb = window.__MOCK_API || !window.supabase ? null : window.supabase.createClient(CFG.url, CFG.key); // boot() explains if the library didn't load
async function q(p){ const { data, error } = await p; if (error) throw error; return data; }
const here = () => location.origin + location.pathname;
const api = window.__MOCK_API || {
  async session(){ return (await q(sb.auth.getSession())).session; },
  onAuth(cb){ sb.auth.onAuthStateChange((ev, s) => cb(ev, s)); },
  signIn: (email, password) => q(sb.auth.signInWithPassword({ email, password })),
  signUp: (email, password, meta) => q(sb.auth.signUp({ email, password, options: { data: meta, emailRedirectTo: here() } })),
  signOut: () => sb.auth.signOut(),
  resetPassword: email => q(sb.auth.resetPasswordForEmail(email, { redirectTo: here() })),
  setPassword: password => q(sb.auth.updateUser({ password })),
  me: uid => q(sb.from('profiles').select('*').eq('id', uid).maybeSingle()),
  updateProfile: (id, f) => q(sb.from('profiles').update(f).eq('id', id).select().maybeSingle()),
  profiles: () => q(sb.from('profiles').select('*').order('created_at', { ascending: false })),
  async settings(){ const r = await q(sb.from('settings').select('value').eq('key', 'main').maybeSingle()); return r ? r.value : {}; },
  saveSettings: v => q(sb.from('settings').upsert({ key: 'main', value: v, updated_at: new Date().toISOString() })),
  catalog: () => q(sb.from('catalog').select('*').order('cat').order('name')),
  upsertItems: rows => q(sb.from('catalog').upsert(rows, { onConflict: 'sku' })),
  saveItem(it){
    const { id, ...f } = it;
    return id ? q(sb.from('catalog').update(f).eq('id', id)) : q(sb.from('catalog').insert(f));
  },
  jobs: () => q(sb.from('jobs').select('*').order('job_date', { ascending: false }).order('id', { ascending: false }).limit(1000)),
  job: id => q(sb.from('jobs').select('*').eq('id', id).maybeSingle()),
  rpc: (fn, args) => q(sb.rpc(fn, args)),
  async upload(path, blob, type, bucket){ await q(sb.storage.from(bucket || 'jobs').upload(path, blob, { contentType: type, upsert: false })); },
  payouts: () => q(sb.from('payouts').select('*').order('created_at', { ascending: false }).limit(1000)),
  payoutLines: () => q(sb.from('payout_lines').select('*').limit(10000)),
  insertSlots: rows => q(sb.from('eval_slots').insert(rows)),
  updateSlot: (id, f) => q(sb.from('eval_slots').update(f).eq('id', id)),
  deleteSlot: id => q(sb.from('eval_slots').delete().eq('id', id)),
  async signedUrls(paths, bucket){
    if (!paths.length) return {};
    const d = await q(sb.storage.from(bucket || 'jobs').createSignedUrls(paths, 3600));
    const m = {}; (d || []).forEach(x => { if (x.signedUrl) m[x.path] = x.signedUrl; }); return m;
  }
};

if (!api.testResults) {
  api.testResults = () => q(sb.from('test_results').select('*'));
  api.saveTest = row => q(sb.from('test_results').upsert(row));
}
/* Preview (Admin): look-only. Every write is refused while previewing; test results still save. */
const PV_MSG = 'Preview is look-only – nothing was saved.';
['updateProfile', 'saveSettings', 'saveItem', 'upsertItems', 'rpc', 'upload', 'insertSlots', 'updateSlot', 'deleteSlot'].forEach(k => {
  const f = api[k];
  api[k] = (...a) => (inPreview() && !(k === 'rpc' && ['assembler_list', 'assembler_stats', 'cancel_fee', 'eval_slot_list', 'app_list', 'app_me', 'payout_ready'].includes(a[0]))) ? Promise.reject(new Error(PV_MSG)) : f.apply(api, a);
});

/* ───────────── Helpers ───────────── */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const cur = () => (S.settings.currency === 'THB' ? '฿' : '₱');
const money = v => cur() + Math.round(num(v)).toLocaleString('en-PH');
const money2 = v => cur() + num(v).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); // exact, for payouts
const todayISO = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); // Asia/Manila
const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const fmtDate = iso => iso ? new Date(String(iso).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const TZ = 'Asia/Manila'; // all times are shown in Philippine time, whatever the phone is set to

const mins = m => { m = num(m); return m >= 60 ? (Math.round(m / 6) / 10) + 'h' : m + 'm'; };
const errMsg = e => (e && (e.message || e.error_description)) || String(e || 'Something went wrong');

function toast(msg, bad){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 4500 : 2600);
}
async function busy(btn, fn){
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { console.warn(e); toast(errMsg(e), true); } finally { if (btn && btn.isConnected) btn.disabled = false; }
}

/* Money split for a job (snapshot of commission / lead share taken at booking) */
// What the customer owes: job total minus refunds, or the kept fee on a missed / late-cancelled visit
const due = j => j.status === 'done' ? Math.max(num(j.total) - num(j.refund), 0) : ['failed_visit','cancelled'].includes(j.status) ? num(j.fee_kept) : 0;
const amt = j => (['done','failed_visit','cancelled'].includes(j.status) ? due(j) : num(j.total));
function split(j){
  const total = amt(j), cut = total * num(j.commission_pct) / 100, pool = total - cut;
  const two = !!j.helper_id || num(j.crew) > 1;
  const lead = two ? pool * num(j.lead_pct) / 100 : pool;
  return { total, cut, pool, lead, helper: two ? pool - lead : 0, two };
}
const myShare = j => { const s = split(j); return j.lead_id === ME().id ? s.lead : j.helper_id === ME().id ? s.helper : 0; };
const windowEnd = j => (j.completed_at ? Date.parse(j.completed_at) + num(j.dispute_hours || 24) * 3600e3 : 0);
// Where the assemblers' money stands for a closed job
function payoutState(j, who){
  const asm = who || (role() === 'assembler' ? ME().id : j.lead_id), po = (S.lineMap || {})[j.id + ':' + asm];
  if (po && po.status === 'sent') return ['green', 'Paid out ' + fmtDate(new Date(Date.parse(po.sent_at) + 8 * 3600e3).toISOString().slice(0, 10)) + ' · ref ' + po.reference];
  if (po && po.status === 'pending') return ['blue', 'In the payout list for Monday'];
  if (j.dispute === 'open') return ['orange', 'On hold – customer reported a problem'];
  if (j.status === 'issue') return ['orange', 'On hold – Taskadoo is checking with the customer'];
  if (!['done','failed_visit'].includes(j.status)) return ['', ''];
  if (Date.now() < windowEnd(j)) return ['blue', 'Held until ' + fmtTime(new Date(windowEnd(j)).toISOString())];
  return j.paid || j.source === 'enterprise' ? ['green', 'Ready for payout'] : ['', 'Waiting for customer payment'];
}

async function boot(){
  try {
    if (!window.__MOCK_API && !(window.supabase && CFG.url)) throw new Error('Could not load the app. Please check your internet connection and reload.');
    if (/type=recovery/.test(location.hash)) S.recovery = true;
    S.session = await api.session();
    api.onAuth(async (ev, s) => {
      if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; }
      const was = S.session && S.session.user.id;
      S.session = s;
      if (ev === 'SIGNED_OUT') { S.me = null; render(); return; }
      if (s && s.user.id !== was) { await afterLogin(); }
      else render();
    });
    await loadBase();
    if (S.session) await afterLogin(); else render();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="auth"><div class="card"><h2>Taskadoo</h2><p class="notice bad" style="margin-top:12px">${esc(errMsg(e))}</p>
      <button class="btn block" style="margin-top:12px" onclick="location.reload()">Reload</button></div></div>`;
  }
}
async function afterLogin(){
  try {
    await refreshMe();
    if (!S.me) { // profile is created by the database on sign-up; wait a moment once
      await new Promise(r => setTimeout(r, 1200)); await refreshMe();
    }
    if (!S.me) throw new Error('Your account is not ready yet. Please sign out and sign in again.');
    if (!S.me.active) { render(); return; }
    await loadJobs();
    if (role() === 'admin') await loadProfiles();
    if (isStaff()) await loadAssemblers(null);
    const r = route();
    if (isApplicant() || role() === 'customer') await loadApp();
    if (['admin', 'evaluator'].includes(role())) await loadApps();
    if (['admin', 'assembler'].includes(role())) await loadPayouts();
    if (S.next && allowed(S.next.split('/')[0])) { history.replaceState(null, '', '#/' + S.next); S.next = null; }
    else if (!r.name || !allowed(r.name)) { history.replaceState(null, '', '#/' + tabsFor()[0][0]); }
    render();
  } catch (e) { console.error(e); toast(errMsg(e), true); render(); }
}

  const imgs = [...document.querySelectorAll('img[data-path]')];
  const fill = () => imgs.forEach(i => { const u = S.urls[i.dataset.path]; if (u) { i.src = u; const a = i.closest('a[data-href]'); if (a) a.href = u; } });
  fill();
  ['jobs', 'apps'].forEach(bk => {
    const need = imgs.filter(i => (i.dataset.bucket || 'jobs') === bk).map(i => i.dataset.path).filter(p => !S.urls[p]);
    if (need.length) api.signedUrls([...new Set(need)], bk).then(m => { Object.assign(S.urls, m); fill(); }).catch(e => console.warn(e));
  });
  const pad = document.getElementById('sigpad'); if (pad) sigPad(pad);
  const nb = document.querySelector('[data-ready-at]'); if (nb && nb.dataset.readyAt) { const ms = Number(nb.dataset.readyAt) - Date.now(); clearTimeout(S.nbT); S.nbT = setTimeout(() => { if (route().name === 'task') render(); }, Math.max(1000, ms + 500)); }
  const tm = document.getElementById('timer');
  if (tm) { const j = S.jobs.find(x => String(x.id) === tm.dataset.id); const f = () => { if (j) tm.textContent = clock(workSecs(j)); }; f(); if (j && !j.paused_at) tickTimer = setInterval(f, 1000); }
}
// assembler app helpers
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_NAME = { mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday', sat:'Saturday', sun:'Sunday' };
const dayKey = iso => DAYS[(new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7];
const hm2min = s => { const p = String(s || '').split(':').map(Number); return p[0] * 60 + (p[1] || 0); };
const manilaDay = ts => new Date(Date.parse(ts) + 8 * 3600e3).toISOString().slice(0, 10);
const isOnline = p => !!(p && p.online && p.online_at && manilaDay(p.online_at) === todayISO());   // the switch counts for today only
// mirrors avail_on() in the database
function availOn(p, iso, slot){
  const a = (p && p.avail) || {}, d = (a.week || {})[dayKey(iso)];
  if ((a.off || []).includes(iso)) return 'time_off';
  if (!d) return 'ok';
  if (d.m === 'shift' && p.mober_emp) return 'shift';
  if (d.m === 'off' || d.m === 'shift') return 'day_off';
  if (slot && d.from && d.to) { const t = slotMin(slot); if (t < hm2min(d.from) || t >= hm2min(d.to)) return 'outside'; }
  return 'ok';
}
const AVAIL_LABEL = { ok: 'Available', time_off: 'Day off', shift: 'Mober shift', day_off: 'Not working that day', outside: 'Outside their hours' };
const srcLabel = j => (j.company ? j.company + ' · via Taskadoo' : 'Taskadoo customer');
const estMin = j => (j.items || []).reduce((s, i) => s + num(i.minutes) * num(i.qty || 1), 0);
// assembly time worked, without paused minutes
const workSecs = j => !j.started_at ? 0 : Math.max(0, ((j.finished_at ? Date.parse(j.finished_at) : j.paused_at ? Date.parse(j.paused_at) : Date.now()) - Date.parse(j.started_at)) / 1000 - num(j.paused_secs));
const stars = n => '★★★★★'.slice(0, Math.round(num(n))) + '☆☆☆☆☆'.slice(0, 5 - Math.round(num(n)));
const PHOTO_SHOTS = [['Before', 'Boxes as found'], ['After – front', 'Finished piece'], ['After – wide', 'Piece in the room'], ['Area left clean', 'Packaging removed']];
const ARRIVE_CHECKS = ['All boxes are here and sealed', 'No crush damage or water marks', 'Fittings bag is included', 'Space cleared and floor protected'];
const clock = sec => { sec = Math.max(0, Math.floor(sec)); const p = n => String(n).padStart(2, '0'); return p(Math.floor(sec / 3600)) + ':' + p(Math.floor(sec % 3600 / 60)) + ':' + p(sec % 60); };

function decideCard(j){

  const myOk = j => (j.lead_id === me ? j.lead_ok : j.helper_ok);
  const offers = mine.filter(j => ['assigned','accepted'].includes(j.status) && !myOk(j));
  const active = mine.filter(j => !CLOSED.includes(j.status) && myOk(j)).sort((a, b) => (a.job_date + String(slotMin(a.slot)).padStart(4, '0')).localeCompare(b.job_date + String(slotMin(b.slot)).padStart(4, '0')));
  const done = mine.filter(j => ['done','failed_visit'].includes(j.status)).slice(0, 10);
  const todayEarn = mine.filter(j => ['done','failed_visit'].includes(j.status) && j.completed_at && manilaDay(j.completed_at) === t).reduce((s, j) => s + myShare(j), 0);

// this week (Mon–Sun, Philippine time), paid the Monday after
function weekCard(done){
  const t = todayISO(), mon = addDays(t, -((new Date(t + 'T00:00:00Z').getUTCDay() + 6) % 7));
  const per = DAYS.map((_, i) => done.filter(j => j.completed_at && manilaDay(j.completed_at) === addDays(mon, i)).reduce((s, j) => s + myShare(j), 0));
  const top = Math.max(...per, 1), total = per.reduce((s, v) => s + v, 0);
  return `<div class="card" style="background:var(--ink);color:#fff;border:0">
    <div class="tiny" style="opacity:.7">This week · paid Monday ${esc(fmtDate(addDays(mon, 7)))}</div><div style="font-weight:700;font-size:26px;color:#FFB27A">${money(total)}</div>
    <div class="bars">${per.map((v, i) => `<div><i class="${addDays(mon, i) === t ? 'now' : ''}" style="height:${Math.max(4, Math.round(v / top * 58))}px" title="${esc(money(v))}"></i><span>${'MTWTFSS'[i]}</span></div>`).join('')}</div></div>`;
}
function payExample(){
  const ex = 1000, c = num(S.settings.commission), pool = ex - ex * c / 100, l = pool * num(S.settings.lead_pct) / 100;
  return `Example: a ${money(ex)} job → Taskadoo ${c}% ${money(ex * c / 100)} → crew pool ${money(pool)}. Solo: you get ${money(pool)}. Team: lead ${money(l)}, extra assembler ${money(pool - l)}. You always see your pay before you accept.`;
}

const CSV_COLS = ['sku', 'name', 'brand', 'category', 'fee', 'crew', 'minutes', 'emoji', 'bookable'];
const csvCell = v => { v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function csvParse(text){
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === ';' || c === '\t') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function csvCheck(text){
  const rows = csvParse(text); if (!rows.length) throw new Error('The file is empty.');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const miss = ['sku', 'name', 'brand', 'category', 'fee'].filter(c => !head.includes(c));
  if (miss.length) throw new Error('The first row must have the column names. Missing: ' + miss.join(', ') + '. Download the CSV first and use it as your template.');
  const col = k => head.indexOf(k), catOf = v => { v = String(v || '').trim().toLowerCase(); const c = cats().find(x => x.id === v || x.name.toLowerCase() === v); return c ? c.id : null; };
  const out = { add: [], change: [], same: 0, errors: [] }, seen = {};
  rows.slice(1).forEach((r, k) => {
    const line = k + 2, g = c => (col(c) < 0 ? '' : String(r[col(c)] == null ? '' : r[col(c)]).trim());
    const sku = g('sku'), bk = g('bookable').toLowerCase();
    const it = { sku, name: g('name'), brand: g('brand'), cat: catOf(g('category')), fee: Number(g('fee').replace(/[₱฿,\s]/g, '')),
      crew: g('crew') === '' ? 1 : Number(g('crew')), minutes: g('minutes') === '' ? 60 : Number(g('minutes')), emoji: g('emoji') || '📦',
      active: !['no', 'n', 'false', '0', 'hidden', 'hide'].includes(bk) };
    const bad = [];
    if (!sku) bad.push('SKU is empty');
    if (sku && seen[sku.toLowerCase()]) bad.push('SKU ' + sku + ' appears twice (also row ' + seen[sku.toLowerCase()] + ')');
    if (!it.name) bad.push('name is empty');
    if (!it.brand) bad.push('brand is empty');
    if (!it.cat) bad.push('category "' + g('category') + '" is not in Settings → Categories');
    if (!isFinite(it.fee) || g('fee') === '' || it.fee < 0) bad.push('fee "' + g('fee') + '" is not a number');
    if (!Number.isInteger(it.crew) || it.crew < 1 || it.crew > 4) bad.push('crew must be 1 to 4');
    if (!Number.isInteger(it.minutes) || it.minutes < 5 || it.minutes > 1440) bad.push('minutes must be a whole number from 5 to 1440');
    if (sku) seen[sku.toLowerCase()] = line;
    if (bad.length) { out.errors.push('Row ' + line + (sku ? ' (' + sku + ')' : '') + ': ' + bad.join('; ')); return; }
    const old = S.catalog.find(c => c.sku.toLowerCase() === sku.toLowerCase());
    if (!old) { out.add.push(it); return; }
    it.sku = old.sku;
    const diff = ['name', 'brand', 'cat', 'fee', 'crew', 'minutes', 'emoji', 'active'].filter(k2 => String(old[k2]) !== String(it[k2]) && !(k2 === 'fee' && num(old.fee) === it.fee));
    if (diff.length) out.change.push(Object.assign(it, { _diff: diff, _old: old })); else out.same++;
  });
  return out;
}

/* ───────────── Photos & signature ───────────── */
function compress(file, max = 1600){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read the photo.')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a photo we can read.')); };
    img.src = url;
  });
}
const rid = () => Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
let sig = { drawn: false };
function sigPad(c){
  const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#262261';
  // the signature survives a screen refresh (e.g. a photo finishing its upload) on the same job
  const keep = sig.id && sig.id === c.dataset.id ? sig.strokes || [] : [];
  sig = { drawn: keep.some(s => s.length > 1), c, id: c.dataset.id, strokes: keep }; let down = false, last = null, line = null;
  keep.forEach(s => { if (s.length < 2) return; x.beginPath(); x.moveTo(s[0][0], s[0][1]); s.slice(1).forEach(p => x.lineTo(p[0], p[1])); x.stroke(); });
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { down = true; last = pt(e); line = [last]; sig.strokes.push(line); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (!down) return; const p = pt(e); x.beginPath(); x.moveTo(last[0], last[1]); x.lineTo(p[0], p[1]); x.stroke(); last = p; line.push(p); sig.drawn = true; };
  c.onpointerup = c.onpointercancel = () => { down = false; };
}

// Tests fixed after a reported problem: id → ISO time of the fix. They come back first as "please test again".
const WN_FIXED = {};

const wnKey = () => 'tk_wn_seen_' + (S.me ? S.me.id : '');
const wnLatest = () => WHATSNEW.reduce((m, x) => (x.d + x.v > m ? x.d + x.v : m), '');
const wnFor = c => c.for.includes('all') || c.for.includes(role()) || (role() === 'admin');
function wnVisible(){ return WHATSNEW.map(r => Object.assign({}, r, { changes: r.changes.filter(wnFor) })).filter(r => r.changes.length); }
function wnUnseen(){ if (!S.me || !wnVisible().length) return false; try { return (localStorage.getItem(wnKey()) || '') < wnLatest(); } catch (e) { return false; } }
const longDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });

/* test results (staging): table test_results, shared by everyone testing */
const TR = { map: {}, loaded: false, loading: false, err: '' };
const TG = { i: null, open: false, note: null, typing: false };
const isTestSite = () => !!CFG.STAGING;
const tsAll = () => Object.entries(WN_TESTS).flatMap(([v, L]) => L.map(t => ({ v, t })));
const titleOf = v => (WHATSNEW.find(r => r.v === v) || {}).title || v;
async function tsLoad(){
  if (TR.loading) return; TR.loading = true;
  try { const d = await api.testResults(); TR.map = {}; (d || []).forEach(r => TR.map[r.id] = r); TR.err = ''; }
  catch (e) { TR.err = /relation|does not exist|schema cache|permission denied/i.test(errMsg(e)) ? 'setup' : 'load'; console.warn(e); }
  TR.loading = false; TR.loaded = true;
  if (route().name === 'whatsnew' || route().name === 'tests') render(); else tgPaint();
}
async function tsSave(id, patch, quiet){
  const cur = TR.map[id] || { status: '', note: '' };
  const row = Object.assign({ id, status: cur.status || '', note: cur.note || '' }, patch, { by: S.me.id, by_name: S.me.full_name || S.me.email, at: new Date().toISOString() });
  TR.map[id] = row;
  if (!quiet) { if (route().name === 'whatsnew') render(); else tgPaint(); }
  try { await api.saveTest(row); } catch (e) { toast(TR.err === 'setup' || /relation|does not exist|schema cache/i.test(errMsg(e)) ? 'Results can\'t be saved yet: run the test-results SQL in Supabase first.' : 'Couldn\'t save: ' + errMsg(e), true); await tsLoad(); }
}
const TG_ROLE = { customer: 'customer', assembler: 'assembler', dispatcher: 'dispatcher', enterprise: 'enterprise', admin: 'admin', evaluator: 'evaluator' };
function tsMine(t){
  const who = t[1].toLowerCase();
  if (S.me.role === 'admin' && !inPreview()) return true;
  if (/everyone/.test(who)) return true;
  return Object.entries(TG_ROLE).some(([w, r]) => who.includes(w) && role() === r);
}
const tsMineId = id => { const x = tsAll().find(({ t }) => t[0] === id); return !!x && tsMine(x.t); };
const tgRetest = id => { const f = WN_FIXED[id], r = TR.map[id]; return !!f && !!r && r.status === 'fail' && r.at < f; };
// oldest release first: accounts and a booking come before newer features
function tgList(){ const L = tsAll().filter(({ t }) => tsMine(t)).sort((x, y) => parseFloat(x.v) - parseFloat(y.v)); return [...L.filter(x => tgRetest(x.t[0])), ...L.filter(x => !tgRetest(x.t[0]))]; }
const tgOpenTest = x => !(TR.map[x.t[0]] || {}).status || tgRetest(x.t[0]);
const tgLeft = () => tgList().filter(tgOpenTest).length;
function tgStart(){ const L = tgList(), k = L.findIndex(tgOpenTest); TG.i = k < 0 ? L.length : k; }
function tsCounts(list){ const c = { pass: 0, fail: 0, skip: 0, left: 0 }; (list || tsAll()).forEach(({ t }) => { const s = (TR.map[t[0]] || {}).status; c[s || 'left']++; }); return c; }
const STLABEL = { pass: 'Worked', fail: 'Problem', skip: 'Skipped' };
function tsMeta(r){ return r && r.at && (r.status || r.note) ? `${r.status ? STLABEL[r.status] : 'Note'} · ${esc(r.by_name || 'Someone')} · ${esc(fmtTime(r.at))}` : ''; }
function tsShow(id){ const f = S.wnF || 'all', s = (TR.map[id] || {}).status || ''; return f === 'all' || (f === 'mine' && tsMineId(id)) || (f === 'left' && !s) || (f === 'fail' && s === 'fail'); }
function tsRow(t){
  const [id, who, title, steps, exp] = t, r = TR.map[id] || {}, s = r.status || '';
  return `<div class="ts ${s ? 'is-' + s : ''}"><div style="min-width:0"><h4><span class="tid">${esc(id)}</span>${esc(title)}<span class="who">${esc(who)}</span></h4>
    ${WN_SETUP[id] ? `<div class="tiny" style="color:var(--orange);font-weight:700">Before you start: ${esc(WN_SETUP[id])}</div>` : ''}
    <ol>${steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol><p class="exp"><b>Should happen:</b> ${esc(exp)}</p></div>
    <div><div class="seg">${[['pass', 'Worked'], ['fail', 'Problem'], ['skip', 'Skip']].map(([k, l]) => `<button data-act="tsset" data-id="${esc(id)}" data-v="${k}" aria-pressed="${s === k}">${l}</button>`).join('')}</div>
    <textarea id="ts-note-${esc(id)}" data-tsnote="${esc(id)}" placeholder="What did you see? (optional)">${esc(r.note || '')}</textarea>
    <div class="meta">${tsMeta(r)}</div></div></div>`;
}
function tsBlock(v){
  const L = WN_TESTS[v]; if (!L || !isTestSite()) return '';
  const vis = L.filter(t => tsShow(t[0])); if ((S.wnF || 'all') !== 'all' && !vis.length) return '';
  const done = L.filter(t => (TR.map[t[0]] || {}).status).length, fail = L.filter(t => (TR.map[t[0]] || {}).status === 'fail').length;
  const open = (S.wnF || 'all') !== 'all' || (S.wnOpen || {})[v];
  return `<details class="wn-tests" data-wn="${esc(v)}" ${open ? 'open' : ''}><summary>Test this <span class="small muted">${done} of ${L.length} done${fail ? ` · <span style="color:var(--red)">${fail} with a problem</span>` : ''}</span></summary>${vis.map(tsRow).join('')}</details>`;

      <button class="btn ghost small" data-act="tsreload">↻ Refresh</button></div>
    <div class="pills">${chip('mine', 'My tests')}${chip('all', 'All tests')}${chip('left', 'Not tested yet')}${chip('fail', 'Problems')}</div></div>`;

function tsReport(){
  const c = tsCounts(), A = tsAll();
  const line = ({ v, t }) => { const r = TR.map[t[0]] || {}; return `- ${t[0]} ${t[2]} (v${v} ${titleOf(v)}; ${t[1]})${r.note ? ': ' + r.note.replace(/\s+/g, ' ') : ''}${r.by_name ? ` [${r.by_name}, ${fmtTime(r.at)}]` : ''}`; };
  const by = s => A.filter(x => ((TR.map[x.t[0]] || {}).status || '') === s);
  const list = arr => (arr.length ? arr.map(line) : ['- none']);
  return [`Taskadoo test results (staging), ${new Date().toLocaleString('en-PH')}`, `Worked ${c.pass}, Problems ${c.fail}, Skipped ${c.skip}, Not tested ${c.left} (of ${A.length})`, '',

      <label class="f"><span>Willing to travel</span><select id="ap_km">${[5, 10, 15, 20, 30, 50].map(k => `<option value="${k}" ${num(d.travel_km || 10) === k ? 'selected' : ''}>${k} km</option>`).join('')}</select></label></div>

      <label class="f"><span>GCash number</span><input id="ap_gnum" type="tel" value="${esc(d.gcash_number || '')}" placeholder="09XX XXX XXXX"></label></div>
      <button class="btn block" data-act="apsave3">Save and continue</button>`;
  }
  if (step === 4) {
    const miss = [1, 2, 3].filter(k => !done(k));
    body = `<h2 style="margin-bottom:6px">${S.moving ? 'Move your evaluation' : 'Book your evaluation'}</h2>
      <div class="small muted" style="margin-bottom:12px">About ${num(S.settings.eval_minutes || 45)} minutes: a short interview and a hands-on build test. ${feeLine()} Your application is sent once you book a time.</div>

      <div class="row" style="margin-top:12px"><button class="btn green" data-act="apbook" ${S.pickSlot ? '' : 'disabled'}>${S.moving ? 'Move to this time' : 'Book this time'}</button>

      <div class="tiny muted" style="margin-top:8px">Need to change it later? You can move it once, up to 2 hours before.</div>`}`;
  }
  return `<div class="narrow">
    ${st === 'no_show' ? '<div class="notice warn" style="margin-bottom:14px">You missed your evaluation. Book a new time below.</div>' : ''}
    <h1>Become a Taskadoo assembler</h1><div class="muted" style="margin-bottom:10px">4 short steps. Your answers are saved as you go.</div>
    ${stepper}<div class="card" style="margin-top:14px">${body}</div></div>`;
}

          ${['booked', 'draft', 'no_show'].includes(a.status) ? `<div class="row" style="margin-top:8px"><button class="btn green small" data-act="docok" data-id="${a.id}" data-k="${k}" data-v="1">OK</button>
            <input id="dn_${k}" placeholder="What's wrong (if not OK)" style="flex:1;min-width:120px;padding:7px 9px"><button class="btn red small" data-act="docok" data-id="${a.id}" data-k="${k}" data-v="0">Not OK</button></div>` : ''}`
          : '<div class="tiny muted">Not uploaded yet</div>'}</div></div></div>`; }).join('')}</div>
    ${a.status === 'booked' ? `<div class="card"><h3 style="margin-bottom:4px">Scorecard</h3><div class="tiny muted" style="margin-bottom:10px">1 = poor · 3 = OK · 5 = excellent</div>
      ${secs.map(sec => `<div class="tiny muted b" style="margin:10px 0 4px">${esc(String(sec).toUpperCase())}</div>${items.filter(i => i.sec === sec).map(i => `<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)">
        <span class="grow small" style="color:var(--ink);font-weight:700">${esc(i.label)}</span>
        <span class="row" style="gap:4px">${[1, 2, 3, 4, 5].map(n => `<button class="tg-x" style="min-width:34px;${num(sc[i.id]) === n ? 'background:var(--ink);color:#fff;border-color:var(--ink)' : ''}" data-act="escore" data-id="${a.id}" data-i="${esc(i.id)}" data-v="${n}">${n}</button>`).join('')}</span></div>`).join('')}`).join('')}
      <div class="notice small" style="margin-top:12px">${rated.length ? `Average <b>${avg.toFixed(1)}</b> of 5 (${rated.length}/${items.length} scored) · suggested: <b>${avg >= 3.5 && !low ? 'Pass' : 'Fail'}</b>${low ? ' (an item scored 2 or lower)' : ''}` : 'Score each item during the interview and the build test.'}</div>

      <label class="f" style="margin-top:12px"><span>Note for the applicant (shown to them)</span><textarea id="ev_note" placeholder="Example: Great attitude and clean build. Welcome!"></textarea></label>
      <div class="row"><button class="btn green" data-act="edecide" data-id="${a.id}" data-v="passed" ${docsOk ? '' : 'disabled'}>✓ Pass – make assembler</button>
        <button class="btn red" data-act="edecide" data-id="${a.id}" data-v="failed">✕ Fail</button><button class="btn ghost" data-act="edecide" data-id="${a.id}" data-v="no_show">Didn't come</button></div></div>`
    : ['passed', 'failed'].includes(a.status) ? `<div class="card"><h3 style="margin-bottom:6px">Result: ${esc(APP_ST[a.status][1])}</h3>
      <div class="small">${items.filter(i => (a.score || {})[i.id]).map(i => esc(i.label) + ': <b>' + a.score[i.id] + '</b>').join(' · ') || 'No scores recorded.'}</div>
      ${a.result_note ? `<div class="notice small" style="margin-top:8px">${esc(a.result_note)}</div>` : ''}<div class="tiny muted" style="margin-top:6px">${esc(a.evaluator_name)} · ${esc(fmtTime(a.evaluated_at))}</div></div>` : ''}
    <div class="card"><h3 style="margin-bottom:8px">History</h3><div class="events">${(a.events || []).slice().reverse().map(e => `<div><span class="b">${esc(APP_EV[e.action] || e.action)}</span>${e.note ? ' – ' + esc(e.note) : ''} <span class="tiny">· ${esc(e.name || '')} · ${esc(fmtTime(e.at))}</span></div>`).join('')}</div></div>`;

const APP_EV = { started: 'Started the application', booked: 'Booked the evaluation', moved: 'Moved the evaluation', cancelled: 'Cancelled the evaluation', doc_ok: 'Document OK',
  doc_bad: 'Document not OK', emp_ok: 'Employee ID confirmed', emp_bad: 'Employee ID not confirmed', passed: 'Passed', failed: 'Failed', no_show: "Didn't come" };
function viewEvalCalendar(){
  if (!S.slots || Date.now() - (S.slotsAt || 0) > 60000) { if (!S.slotsLoading) { S.slotsLoading = true; loadSlots().catch(e => toast(errMsg(e), true)).finally(() => { S.slotsLoading = false; render(); }); } }
  const hubs = S.settings.hubs || [], up = (S.slots || []).filter(x => Date.parse(x.starts_at) > Date.now() - 12 * 3600e3);
  const byDay = {}; up.forEach(x => { const d = new Date(Date.parse(x.starts_at) + 8 * 3600e3).toISOString().slice(0, 10); (byDay[d] = byDay[d] || []).push(x); });
  const times = S.newTimes || (S.newTimes = ['9:00 AM', '1:00 PM']);
  return `<div class="split"><div>
    ${!S.slots ? '<div class="muted">Loading…</div>' : Object.keys(byDay).length ? Object.entries(byDay).map(([d, xs]) => `<h3 style="margin:6px 0 8px">${esc(fmtDate(d))}</h3><div class="list" style="margin-bottom:14px">${xs.map(x => `<div class="li" style="cursor:default${x.active ? '' : ';opacity:.6'}"><div class="row">
      <div class="grow"><div class="b">${esc(new Date(x.starts_at).toLocaleTimeString('en-PH', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }))} · ${esc(x.hub)}</div>
        <div class="tiny muted">${x.booked} of ${x.seats} booked${x.active ? '' : ' · closed – applicants can\'t pick it'}</div></div>

      <div class="row" style="margin:10px 0 12px"><input type="time" id="ns_time" value="10:00" style="width:auto"><button class="btn soft small" data-act="nstadd">+ Add time</button></div>

/* ───────────── Actions ───────────── */
async function reloadJob(id){ const j = await api.job(id); const k = S.jobs.findIndex(x => x.id === id); if (j) { if (k >= 0) S.jobs[k] = j; else S.jobs.unshift(j); } else if (k >= 0) S.jobs.splice(k, 1); }
const ACT = {
  menu(){ S.menu = !S.menu; render(); },
  paytab(b){ S.payTab = b.dataset.v; render(); },
  async payreload(b){ await busy(b, async () => { await loadJobs(); await loadPayouts(); S.ready = null; render(); toast('Updated'); }); },
  async pocreate(b){ const end = S.poEnd || lastSunday();
    if (!confirm('Create the payout list for jobs ready by ' + fmtDate(end) + '?')) return;
    await busy(b, async () => { const n = await api.rpc('payout_create', { p_end: end }); await loadPayouts(); S.ready = null; toast(n + ' payout' + (n === 1 ? '' : 's') + ' ready to send'); render(); }); },
  async posent(b){ await busy(b, async () => { await api.rpc('payout_mark_sent', { p_id: Number(b.dataset.id), p_reference: val('po_ref_' + b.dataset.id) }); await loadPayouts(); toast('Marked sent'); render(); }); },
  async pocancel(b){ if (!confirm('Cancel this payout? Its jobs go back to "ready" and can be paid in the next list.')) return;
    await busy(b, async () => { await api.rpc('payout_cancel', { p_id: Number(b.dataset.id) }); await loadPayouts(); S.ready = null; render(); }); },
  podl(){ const pend = (S.payouts || []).filter(x => x.status === 'pending');
    const lines = [['name', 'gcash_number', 'amount', 'note'].join(',')].concat(pend.map(x => [x.gcash_name || x.assembler_name, x.gcash_number, num(x.amount).toFixed(2), 'Taskadoo payout – jobs ready by ' + x.period_end].map(csvCell).join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
    a.download = 'taskadoo-payouts-' + todayISO() + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },
  async copy(b){ try { await navigator.clipboard.writeText(b.dataset.v); toast('Copied ' + b.dataset.v); } catch (e) { toast(b.dataset.v); } },
  // application (applicant)
  astep(b){ S.aStep = Number(b.dataset.v); S.aSel = null; render(); window.scrollTo(0, 0); },
  async apsave1(b){ await busy(b, async () => {
    if (val('ap_name').length < 2) throw new Error('Please enter your full name.');
    if (val('ap_mobile').replace(/\D/g, '').length < 10) throw new Error('Please enter a valid mobile number.');
    if (!val('ap_bd')) throw new Error('Please enter your birth date.');
    S.app = await api.rpc('app_save', { p: { full_name: val('ap_name'), mobile: val('ap_mobile'), birth_date: val('ap_bd') } });
    await refreshMe(); S.aStep = 2; render(); window.scrollTo(0, 0); }); },
  async apmober(b){ await busy(b, async () => { S.app = await api.rpc('app_save', { p: { mober: b.dataset.v === '1' } }); render(); }); },
  async apsave2(b){ await busy(b, async () => {
    const a = S.app || {}, d = a.data || {};
    if (d.mober === undefined) throw new Error('Tell us if you are a Mober employee.');
    if (d.mober) { if (val('ap_emp').length < 3) throw new Error('Enter your Mober employee ID.'); S.app = await api.rpc('app_save', { p: { employee_id: val('ap_emp') } }); }
    const miss = needDocs(S.app).filter(k => !(S.app.docs || {})[k]);
    if (miss.length) throw new Error('Please add a photo of your ' + miss.map(k => DOCS[k]).join(' and ') + '.');
    S.aStep = 3; S.aSel = null; render(); window.scrollTo(0, 0); }); },
  aptog(b){ const k = b.dataset.k, v = b.dataset.v, l = S.aSel[k]; const i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else l.push(v); b.classList.toggle('on'); },
  apcommit(b){ S.aSel.commitment = b.dataset.v; document.querySelectorAll('[data-act=apcommit]').forEach(x => x.classList.toggle('on', x === b)); },
  async apsave3(b){ await busy(b, async () => {
    const sel = S.aSel || {};
    if (!val('ap_area')) throw new Error('Choose your base location.');
    if (!sel.commitment) throw new Error('Choose full-time or part-time.');
    if (val('ap_gname').length < 2) throw new Error('Enter the name on your GCash account.');
    if (val('ap_gnum').replace(/\D/g, '').length < 10) throw new Error('Enter your GCash number.');
    S.app = await api.rpc('app_save', { p: { base_area: val('ap_area'), travel_km: Number(val('ap_km')), years: val('ap_years'), brands: sel.brands, skills: sel.skills,
      commitment: sel.commitment, gcash_name: val('ap_gname'), gcash_number: val('ap_gnum') } });
    S.aStep = 4; S.aSel = null; S.slots = null; render(); window.scrollTo(0, 0); }); },
  pickslot(b){ S.pickSlot = Number(b.dataset.id); render(); },
  async apbook(b){ await busy(b, async () => {
    S.app = await api.rpc('app_book', { p_slot: S.pickSlot }); const moved = S.moving;
    S.pickSlot = null; S.moving = false; S.aStep = null; S.slots = null; await refreshMe(); toast(moved ? 'Evaluation moved' : 'Booked! See you at the evaluation.'); render(); window.scrollTo(0, 0); }); },
  appmove(){ S.moving = true; S.pickSlot = null; S.slots = null; render(); },
  appmovex(){ S.moving = false; S.pickSlot = null; render(); },
  async appcancel(b){ if (!confirm('Cancel your evaluation? You can book a new time later.')) return;
    await busy(b, async () => { S.app = await api.rpc('app_cancel', {}); S.aStep = 4; render(); }); },

  sdaddao(){ const v = val('sd_ao'); if (!v) return toast('Type the service name first.', true);
    const base = v.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'addon'; let id = base, n = 2;
    while ((S.sd.addons || []).some(a => a.id === id)) id = base + '-' + n++;
    S.sd.addons = [...(S.sd.addons || []), { id, name: v, desc: '', price: 0 }]; render(); },
  sdaddskill(){ const v = val('sd_skill'); if (!v) return; if ((S.sd.skills || []).includes(v)) return toast(v + ' is already there.', true); S.sd.skills = [...(S.sd.skills || []), v]; render(); },
  sdaddei(){ const v = val('sd_ei'); if (!v) return toast('Type the item first.', true);
    S.sd.eval_items = [...(S.sd.eval_items || []), { id: 'i' + Date.now().toString(36), sec: 'Build test', label: v }]; render(); },
  async savesettings(b){ await busy(b, async () => {
    const v = S.sd;
    const n = k => num(v[k]);
    if (n('commission') < 0 || n('commission') > 90) throw new Error('Commission must be between 0 and 90%.');
    if (n('lead_pct') < 0 || n('lead_pct') > 100) throw new Error('Lead share must be between 0 and 100%.');
    if (!(v.slots || []).length) throw new Error('Add at least one time slot.');
    if (!(v.areas || []).length) throw new Error('Add at least one service area.');
    if ((v.categories || []).some(c => !String(c.name).trim())) throw new Error('Every category needs a name.');
    ['commission','lead_pct','dispute_hours','cancel_free_hours','cancel_fee','nobody_wait_min','fail_pct','fail_max','joining_fee','min_age','eval_minutes'].forEach(k => v[k] = n(k));
    if (!(v.hubs || []).length || v.hubs.some(h => !String(h.name).trim())) throw new Error('Every hub needs a name.');
    if ((v.eval_items || []).some(i => !String(i.label).trim())) throw new Error('Every scorecard item needs a text.');
    if (v.min_age < 18) throw new Error('The minimum age can\'t be below 18.');
    if (v.dispute_hours < 1) throw new Error('Allow at least 1 hour to report a problem.');
    await api.saveSettings(v); S.settings = JSON.parse(JSON.stringify(v)); S.sd = null; toast('Settings saved'); render(); }); },
  // problems & missed visits
  reportopen(b){ S.report = Number(b.dataset.id); render(); setTimeout(() => { const t = document.getElementById('rp_note'); if (t) t.focus(); }, 50); },
  reportx(){ S.report = null; render(); },
  async report(b){ await busy(b, async () => { const id = Number(b.dataset.id);
    await api.rpc('report_problem', { p_job: id, p_note: val('rp_note') }); S.report = null; await reloadJob(id); toast('Sent. Taskadoo will contact you.'); render(); }); },
  nosignopen(b){ S.noSign = Number(b.dataset.id); render(); setTimeout(() => { const t = document.getElementById('ns_note'); if (t) t.focus(); }, 50); },
  nosignx(){ S.noSign = null; render(); },
  async nosign(b){ await busy(b, async () => { const id = Number(b.dataset.id);
    await api.rpc('job_action', { p_job: id, p_action: 'no_sign', p: { note: val('ns_note') } }); S.noSign = null; await reloadJob(id); toast('Sent to Taskadoo'); render(); window.scrollTo(0, 0); }); },
  async nobody(b){ if (!confirm('End this visit because nobody is home? The customer will be charged the failed-visit fee.')) return;
    await busy(b, async () => { const id = Number(b.dataset.id);
      await api.rpc('job_action', { p_job: id, p_action: 'nobody_home', p: { note: val('nh_note') } }); S.nhNote = ''; await reloadJob(id); toast('Visit ended – nobody home'); render(); window.scrollTo(0, 0); }); },
  resopt(b){ const keep = val('res_note'), amt0 = val('res_amt'); S.resOpt = b.dataset.v; render();
    const t = document.getElementById('res_note'); if (t) t.value = keep; const a = document.getElementById('res_amt'); if (a && amt0) a.value = amt0; },
  async resolve(b){ await busy(b, async () => { const id = Number(b.dataset.id);
    if (S.resOpt === 'full' && !confirm('Refund the full amount?')) return;
    const r = await api.rpc('resolve_job', { p_job: id, p_outcome: S.resOpt, p_amount: num(val('res_amt')), p_note: val('res_note') });
    S.resOpt = null; await reloadJob(id); if (r && r.revisit_id) await reloadJob(r.revisit_id);
    toast(r && r.revisit_id ? 'Decision saved – re-visit job created. Assign it now.' : 'Decision saved'); render(); }); },
  gotoattention(b, e){ e.preventDefault(); S.dFilter = 'attention'; S.dFilterSet = true; go('dispatch'); },
};
const CHANGE = {
  async appdoc(el){
    const f = el.files[0], kind = el.dataset.kind; el.value = ''; if (!f) return;
    const label = el.closest('label'); if (label) { label.style.opacity = .6; label.firstChild.textContent = 'Uploading… '; }
    try {
      const blob = await compress(f, 1800), path = S.me.id + '/' + kind + '_' + rid() + '.jpg';
      await api.upload(path, blob, 'image/jpeg', 'apps');
      S.app = await api.rpc('app_doc', { p_kind: kind, p_path: path }); toast(DOCS[kind] + ' added');
    } catch (e) { console.warn(e); toast(errMsg(e), true); }
    render();
  },
  async csvfile(el){ const f = el.files[0]; el.value = ''; if (!f) return;
    try { if (f.size > 2e6) throw new Error('That file is too big for a catalogue (over 2 MB).'); S.csv = csvCheck(await f.text()); render(); }
    catch (e) { toast(errMsg(e), true); } },
  pvswitch(el){ const v = el.value; if (v.startsWith('r:')) pvRole(v.slice(2)); else pvPerson(v.slice(2)); },
  async photos(el){
    const id = Number(el.dataset.id), files = [...el.files]; if (!files.length) return;
    const label = el.closest('label'); if (label) { label.style.opacity = .6; label.firstChild.textContent = 'Uploading… '; }
    try {
      for (const f of files) {
        const blob = await compress(f), path = id + '/' + rid() + '.jpg';
        await api.upload(path, blob, 'image/jpeg');
        await api.rpc('job_action', { p_job: id, p_action: 'photo', p: { path, label: el.dataset.label || '' } });
      }
      await reloadJob(id); toast(files.length > 1 ? files.length + ' photos added' : 'Photo added');
    } catch (e) { console.warn(e); toast(errMsg(e), true); }
    render();
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); } return; }
  if (b.classList.contains('modal-bg') && e.target !== b) return; // clicks inside the edit window don't close it
  const f = ACT[b.dataset.act]; if (f) { if (b.tagName === 'A') e.preventDefault(); f(b, e); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  S[k] = e.target.value;
  if (k === 'search' || k === 'uSearch' || k === 'pvSearch' || k === 'cSearch') { const pos = e.target.selectionStart; render(); const el = document.querySelector('[data-in="' + k + '"]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }
  if (k === 'dDate' || k === 'poEnd') render();
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !S.sd) return;
  if (t.dataset.sd != null) { S.sd[t.dataset.sd] = t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value; sdPaint(); }
  if (t.dataset.cat != null) { S.sd.categories[Number(t.dataset.cat)].name = t.value; sdPaint(); }
  if (t.dataset.hub != null) { S.sd.hubs[Number(t.dataset.hub)][t.dataset.f] = t.value; sdPaint(); }
  if (t.dataset.ao != null) { S.sd.addons[Number(t.dataset.ao)][t.dataset.f] = t.dataset.f === 'price' ? (t.value === '' ? 0 : Number(t.value)) : t.value; sdPaint(); }
  if (t.dataset.ei != null && t.tagName === 'INPUT') { S.sd.eval_items[Number(t.dataset.ei)].label = t.value; sdPaint(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.sd != null && S.sd && t.tagName === 'SELECT') { S.sd[t.dataset.sd] = t.value; sdPaint(); render(); }
  if (t.dataset && t.dataset.ei != null && t.tagName === 'SELECT' && S.sd) { S.sd.eval_items[Number(t.dataset.ei)].sec = t.value; sdPaint(); } });
document.addEventListener('input', e => { if (e.target.id === 'nh_note') S.nhNote = e.target.value; if (e.target.id === 'ck_note') S.ckNote = e.target.value; if (e.target.id === 'rt_note') S.rtNote = e.target.value; });
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.chk != null) {   // arrival box checks
    const id = t.dataset.id, s = new Set(((S.chk = S.chk || {})[id]) || []); t.checked ? s.add(Number(t.dataset.chk)) : s.delete(Number(t.dataset.chk)); S.chk[id] = [...s];
    const b = document.getElementById('startbtn'); if (b) { b.disabled = s.size < ARRIVE_CHECKS.length; const h = b.nextElementSibling; if (h) h.textContent = b.disabled ? 'Tick all 4 boxes to start' : 'Starts the timer the customer sees'; }
  }
  if (t.dataset.wk && S.wk) {    // weekly pattern
    const d = S.wk[t.dataset.wk];
    if (t.dataset.f === 'mode') { const v = t.value; d.m = v === 'off' ? 'off' : v === 'shift' ? 'shift' : 'hours'; if (v === 'set') { d.from = d.from || '08:00'; d.to = d.to || '18:00'; } else { d.from = ''; d.to = ''; } }
    else d[t.dataset.f] = t.value;
    render();
  }
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.cd; if (k) { CD[k] = e.target.value; saveCD(); } });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.cd; if (k) { CD[k] = e.target.value; saveCD(); } });
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-nh]')) S.nhOpen = e.target.open; }, true);
const noteT = {};
document.addEventListener('input', e => {
  const t = e.target, id = t.dataset && t.dataset.tsnote; if (id == null) return;
  clearTimeout(noteT[id]); TG.typing = true;
  noteT[id] = setTimeout(() => { TG.typing = false; const v = t.value.slice(0, 2000);
    if (v !== ((TR.map[id] || {}).note || '')) tsSave(id, { note: v }, true).then(() => { const m = t.closest('.ts,.tg-card'); const el = m && m.querySelector('.meta,.tg-saved'); if (el) el.textContent = 'Note saved · ' + fmtTime(new Date().toISOString()); }); }, 900);
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.wn-tests') && (S.wnF || 'all') === 'all') S.wnOpen = Object.assign(S.wnOpen || {}, { [d.dataset.wn]: d.open }); }, true);
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.change; if (k && CHANGE[k]) CHANGE[k](e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.auth') && e.target.tagName === 'INPUT') { const b = document.querySelector('.auth .btn[data-act]'); if (b) b.click(); } });
window.addEventListener('hashchange', async () => {
  S.menu = false; S.resOpt = null; S.report = null; S.noSign = null; S.editItem = null; S.csv = null; S.wk = null;
  if (route().name === 'eval') S.eTab = 'apps';
  if (route().name === 'profile') S.statsFor = null;   // fresh scores each time Profile opens
  const r = route();
  if (S.me && isStaff() && r.name === 'job') { const j = S.jobs.find(x => String(x.id) === r.arg); try { await loadAssemblers(j ? j.job_date : null, j ? j.slot : null); } catch (e) { console.warn(e); } }
  render(); if (!['job'].includes(r.name)) window.scrollTo(0, 0);
});
/* light auto-refresh for lists (skipped while typing) */
setInterval(async () => {
  if (!S.me || document.hidden) return;
  const r = route().name;
  if (!['tasks','bookings','dispatch','booking','evals','apply'].includes(r)) return;
  const a = document.activeElement; if (a && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName)) return;
  try { if (r === 'evals') await loadApps(); else if (r === 'apply') { if (!S.app || S.app.status !== 'booked') return; await loadApp(); } else await loadJobs(); if (route().name === r) render(); } catch (e) { console.warn(e); }
}, 45000);
boot();
</script>
