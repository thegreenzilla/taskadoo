<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskadoo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#262261">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taskadoo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#262261; --blue:#0E77BA; --blue-soft:#E2F0FA; --bg:#ECE9E2; --card:#fff; --soft:#FAF8F3;
  --line:#EFEBE3; --line2:#E0DBD1; --text:#55505F; --muted:#8E8896; --faint:#A39EAC;
  --green:#15875A; --green-soft:#DFF1E9; --orange:#E8772E; --orange-soft:#FAE6D5; --red:#C62828; --red-soft:#FCE4E4;
  --radius:18px; --shadow:0 1px 2px rgba(38,34,97,.06),0 6px 24px rgba(38,34,97,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue)}
h1,h2,h3{color:var(--ink);margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:900} h2{font-size:20px;font-weight:800} h3{font-size:16px;font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;border:1px solid var(--line2);background:var(--soft);border-radius:12px;padding:11px 12px;font-weight:600;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff}
textarea{min-height:80px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.green{background:var(--green)}
.btn.red{background:#fff;color:var(--red);border:1px solid #F1C4C4}
.btn.small{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.b{font-weight:800;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.grid2>.card,.grid2>.card+.card{margin-top:0}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:var(--soft);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.orange{background:var(--orange-soft);color:var(--orange);border-color:transparent}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.ink{background:var(--ink);color:#fff;border-color:transparent}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pill{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill .n{opacity:.6;margin-left:4px}
/* layout */
.top{position:sticky;top:0;z-index:20;background:rgba(236,233,226,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.top img.logo{height:26px;display:block}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.nav a{padding:8px 12px;border-radius:10px;font-weight:800;color:var(--text);text-decoration:none;white-space:nowrap;font-size:14.5px}
.nav a.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;cursor:pointer;border:0}
.main{max-width:1200px;margin:0 auto;padding:20px 16px 110px}
.narrow{max-width:640px;margin:0 auto}
.bottom{display:none}
.menu{position:absolute;right:16px;top:54px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;min-width:220px;z-index:30}
.menu .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none}
.menu .mi:hover{background:var(--soft)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.sticky{position:sticky;top:76px}
.backsm{display:none;margin-bottom:10px}
.list>.li{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;color:inherit;text-decoration:none}
.list>.li+.li{margin-top:8px}
.list>.li.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv>dt{color:var(--muted);font-weight:700} .kv>dd{margin:0;color:var(--ink);font-weight:700;word-break:break-word}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:7px 0;border-bottom:1px dashed var(--line2);vertical-align:top}
.lines td.r{text-align:right;white-space:nowrap;font-weight:800;color:var(--ink)}
.lines tr:last-child td{border-bottom:0}
.tot{display:flex;justify-content:space-between;font-weight:900;color:var(--ink);font-size:17px;padding-top:10px;border-top:2px solid var(--ink);margin-top:6px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:6px}
.notice{border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--blue-soft);color:var(--ink)}
.notice.warn{background:var(--orange-soft)} .notice.ok{background:var(--green-soft)} .notice.bad{background:var(--red-soft);color:var(--red)}
/* catalogue */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.item .em{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:24px}
.item .nm{font-weight:800;color:var(--ink);line-height:1.25}
.item .fee{font-weight:900;color:var(--ink);font-size:17px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.qty button{border:0;background:none;width:34px;height:34px;font-weight:900;font-size:18px;cursor:pointer;color:var(--ink)}
.qty span{min-width:26px;text-align:center;font-weight:900;color:var(--ink)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--ink);color:#fff}
.cartbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.cartbar .btn{background:#fff;color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:11px 8px;font-weight:800;cursor:pointer;color:var(--ink)}
.slot.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* timeline */
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps i{flex:1;height:6px;border-radius:4px;background:var(--line2)}
.steps i.on{background:var(--green)}
.events{font-size:13px;color:var(--muted)}
.events div{padding:4px 0;border-bottom:1px solid var(--line)}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photos a,.photos .ph{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.sig{width:100%;height:180px;border:2px dashed var(--line2);border-radius:14px;background:#fff;touch-action:none;display:block}
.big{font-size:28px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.money{font-weight:900;color:var(--green)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:8px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input,.tbl select{padding:7px 8px;border-radius:9px}
.scroll{overflow-x:auto}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth .card{width:100%;max-width:420px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs2 button{border:0;background:none;padding:9px;border-radius:9px;font-weight:800;cursor:pointer;color:var(--muted)}
.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.choice{display:grid;gap:8px;margin-bottom:12px}
.choice button{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;font-weight:800;color:var(--ink)}
.choice button.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.choice small{display:block;font-weight:600;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:800;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--red)}
.stagebadge{position:fixed;left:10px;bottom:10px;z-index:70;background:#d32f2f;color:#fff;font:800 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.08em;padding:5px 10px;border-radius:999px;pointer-events:none}
.offer{border:2px solid var(--orange);border-radius:18px;background:#fff;padding:16px}
.timer{font-size:40px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* edit window + unsaved bar */
.modal-bg{position:fixed;inset:0;background:rgba(38,34,97,.35);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(38,34,97,.3)}
.sdbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.sdbar[hidden]{display:none}
.sdbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.sdbar .b{color:#fff}
.tg-x:disabled{opacity:.35;cursor:default}
/* what's new + tests */
.wn-rel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.wn-rel+.wn-rel{margin-top:14px}
.wn-rel h2{font-size:18px}
.wn-v{font-family:ui-monospace,Menlo,monospace;font-weight:800;color:var(--blue)}
.wn-ch{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px;color:var(--ink)}
.kind{flex:none;font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;margin-top:2px}
.kind.New{background:var(--green-soft);color:var(--green)} .kind.Improved{background:var(--blue-soft);color:var(--blue)} .kind.Fixed{background:var(--orange-soft);color:var(--orange)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}
.av{position:relative} .av .dot{position:absolute;top:-1px;right:-1px;margin:0;border:2px solid var(--bg)}
details.wn-tests{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.wn-tests>summary{cursor:pointer;font-weight:900;color:var(--ink)}
.ts{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--soft)}
.ts.is-pass{background:var(--green-soft)} .ts.is-fail{background:var(--red-soft)} .ts.is-skip{opacity:.75}
.ts h4{margin:0 0 4px;color:var(--ink);font-size:14.5px}
.ts .tid{font-family:ui-monospace,Menlo,monospace;color:var(--blue);margin-right:6px}
.ts .who{margin-left:8px;font-size:11.5px;font-weight:800;color:var(--muted)}
.ts ol{margin:4px 0;padding-left:18px;font-size:13.5px} .ts .exp{margin:4px 0 0;font-size:13.5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px}
.seg button{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 4px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ts textarea{min-height:56px;font-size:13px;padding:8px}
.ts .meta,.tg-saved{font-size:11.5px;color:var(--muted);margin-top:4px}
.wn-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.wn-sum .c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.wn-sum .c b{display:block;font-size:24px;font-weight:900;color:var(--ink)} .wn-sum .c span{font-size:12px;font-weight:800;color:var(--muted)}
.wn-sum .c.p b{color:var(--green)} .wn-sum .c.f b{color:var(--red)}
/* guided tests panel */
.tg-panel[hidden],.tg-fab[hidden]{display:none!important}
.tg-fab{position:fixed;right:16px;bottom:16px;z-index:65;border:0;border-radius:999px;padding:12px 16px;font-weight:900;background:var(--ink);color:#fff;box-shadow:0 6px 20px rgba(38,34,97,.35);cursor:pointer}
.has-cart .tg-fab,.has-sd .tg-fab{bottom:80px}
.tg-fab .rdy{background:var(--orange);border-radius:999px;padding:1px 8px;margin-left:6px}
.tg-panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;z-index:80;background:var(--bg);border-left:1px solid var(--line2);box-shadow:-10px 0 30px rgba(38,34,97,.15);display:flex;flex-direction:column}
.tg-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2);background:#fff}
.tg-head b{flex:1;color:var(--ink);font-size:16px}
.tg-x{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:6px 10px;font-weight:800;cursor:pointer;color:var(--ink)}
.tg-body{flex:1;overflow:auto;padding:14px}
.tg-solo{max-width:560px;margin:0 auto}
.tg-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.tg-card h2{font-size:21px}
.tg-card ul{margin:0;padding-left:18px} .tg-card li{margin:4px 0}
.tg-upd{font-size:12px;font-weight:800;color:var(--muted)}
.tg-where{justify-self:start;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800}
.tg-steps{margin:0;padding-left:22px;font-size:16px;color:var(--ink)} .tg-steps li{margin:6px 0}
.tg-exp{background:var(--green-soft);border-radius:12px;padding:12px;font-size:15px;color:var(--ink)}
.tg-setup{background:var(--orange-soft);border-radius:12px;padding:12px;font-size:14.5px;color:var(--ink)}
.tg-fixed{background:var(--blue);color:#fff;border-radius:12px;padding:10px 12px;font-weight:900}
.tg-btns{display:grid;gap:8px}
.tg-btns button{border:1px solid var(--line2);background:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.tg-btns button.ok{background:var(--green);color:#fff;border-color:var(--green)}
.tg-btns button.bad{background:#fff;color:var(--red);border-color:#F1C4C4}
.tg-btns button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.tg-nav{display:flex;justify-content:space-between;gap:8px}
.tg-prog{height:8px;background:var(--line2);border-radius:6px;overflow:hidden;margin:4px 0 12px} .tg-prog i{display:block;height:100%;background:var(--green)}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:800;cursor:pointer;padding:0;text-decoration:underline}
/* preview bar */
.pvbar{background:#FFE08A;color:#3B2F00;padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:14px;position:sticky;top:0;z-index:22}
.pvbar select{width:auto;padding:6px 8px;background:#fff}
.pvbar .btn{padding:7px 12px}
.has-pv .top{top:46px}
.roles4{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.roles4 button{text-align:left;border:1px solid var(--line2);background:#fff;border-radius:14px;padding:14px;cursor:pointer;font-weight:900;color:var(--ink)}
.roles4 button small{display:block;font-weight:600;color:var(--muted);margin-top:4px}
@media (max-width:860px){
  .ts{grid-template-columns:1fr}
  .wn-sum{grid-template-columns:repeat(2,1fr)}
  .tg-fab{bottom:calc(68px + env(safe-area-inset-bottom))}
  .has-cart .tg-fab{bottom:calc(140px + env(safe-area-inset-bottom))}
  .has-bottom .sdbar{bottom:calc(58px + env(safe-area-inset-bottom))}
  .has-sd .tg-fab{bottom:calc(130px + env(safe-area-inset-bottom))}
  .has-pv .top{top:0}
  .pvbar{position:static}
}
@media (max-width:860px){
  .split{grid-template-columns:1fr}
  .sticky{position:static}
  .nav{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:24;background:#fff;border-top:1px solid var(--line2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom a{flex:1;text-align:center;padding:7px 2px;border-radius:10px;font-weight:800;font-size:12px;color:var(--muted);text-decoration:none}
  .bottom a .i{display:block;font-size:19px;line-height:1.2}
  .bottom a.on{color:var(--ink);background:var(--blue-soft)}
  .has-bottom .cartbar{bottom:calc(58px + env(safe-area-inset-bottom))}
  .grid2{grid-template-columns:1fr}
  h1{font-size:23px}
  .stagebadge{bottom:auto;top:18px;left:auto;right:60px}
  .split.has-sel>.list{display:none}
  .backsm{display:inline-block!important}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="app"><div class="auth"><div class="muted">Loading…</div></div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ───────────── Data access (all Supabase calls live here) ───────────── */
const CFG = window.TASKADOO_CONFIG || {};
const sb = window.__MOCK_API ? null : window.supabase.createClient(CFG.url, CFG.key);
async function q(p){ const { data, error } = await p; if (error) throw error; return data; }
const here = () => location.origin + location.pathname;
const api = window.__MOCK_API || {
  async session(){ return (await q(sb.auth.getSession())).session; },
  onAuth(cb){ sb.auth.onAuthStateChange((ev, s) => cb(ev, s)); },
  signIn: (email, password) => q(sb.auth.signInWithPassword({ email, password })),
  signUp: (email, password, meta) => q(sb.auth.signUp({ email, password, options: { data: meta, emailRedirectTo: here() } })),
  signOut: () => sb.auth.signOut(),
  resetPassword: email => q(sb.auth.resetPasswordForEmail(email, { redirectTo: here() })),
  setPassword: password => q(sb.auth.updateUser({ password })),
  me: uid => q(sb.from('profiles').select('*').eq('id', uid).maybeSingle()),
  updateProfile: (id, f) => q(sb.from('profiles').update(f).eq('id', id).select().maybeSingle()),
  profiles: () => q(sb.from('profiles').select('*').order('created_at', { ascending: false })),

/* Money split for a job (snapshot of commission / lead share taken at booking) */
// What the customer owes: job total minus refunds, or the kept fee on a missed / late-cancelled visit
const due = j => j.status === 'done' ? Math.max(num(j.total) - num(j.refund), 0) : ['failed_visit','cancelled'].includes(j.status) ? num(j.fee_kept) : 0;
const amt = j => (['done','failed_visit','cancelled'].includes(j.status) ? due(j) : num(j.total));
function split(j){
  const total = amt(j), cut = total * num(j.commission_pct) / 100, pool = total - cut;
  const two = !!j.helper_id || num(j.crew) > 1;
  const lead = two ? pool * num(j.lead_pct) / 100 : pool;
  return { total, cut, pool, lead, helper: two ? pool - lead : 0, two };
}
const myShare = j => { const s = split(j); return j.lead_id === ME().id ? s.lead : j.helper_id === ME().id ? s.helper : 0; };
const windowEnd = j => (j.completed_at ? Date.parse(j.completed_at) + num(j.dispute_hours || 24) * 3600e3 : 0);
// Where the assemblers' money stands for a closed job
function payoutState(j){
  if (j.dispute === 'open') return ['orange', 'On hold – customer reported a problem'];
  if (j.status === 'issue') return ['orange', 'On hold – Taskadoo is checking with the customer'];
  if (!['done','failed_visit'].includes(j.status)) return ['', ''];
  if (Date.now() < windowEnd(j)) return ['blue', 'Held until ' + fmtTime(new Date(windowEnd(j)).toISOString())];
  return j.paid ? ['green', 'Ready for payout'] : ['', 'Waiting for customer payment'];
}

async function boot(){
  try {
    if (!window.__MOCK_API && !(window.supabase && CFG.url)) throw new Error('Could not load the app. Please check your internet connection and reload.');
    if (/type=recovery/.test(location.hash)) S.recovery = true;
    S.session = await api.session();
    api.onAuth(async (ev, s) => {
      if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; }
      const was = S.session && S.session.user.id;
      S.session = s;
      if (ev === 'SIGNED_OUT') { S.me = null; render(); return; }
      if (s && s.user.id !== was) { await afterLogin(); }
      else render();
    });
    await loadBase();
    if (S.session) await afterLogin(); else render();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="auth"><div class="card"><h2>Taskadoo</h2><p class="notice bad" style="margin-top:12px">${esc(errMsg(e))}</p>
      <button class="btn block" style="margin-top:12px" onclick="location.reload()">Reload</button></div></div>`;
  }
}
async function afterLogin(){
  try {
    await refreshMe();
    if (!S.me) { // profile is created by the database on sign-up; wait a moment once
      await new Promise(r => setTimeout(r, 1200)); await refreshMe();
    }
    if (!S.me) throw new Error('Your account is not ready yet. Please sign out and sign in again.');
    if (!S.me.active) { render(); return; }
    await loadJobs();
    if (role() === 'admin') await loadProfiles();
    if (isStaff()) await loadAssemblers(null);
    const r = route();
    if (!r.name || !allowed(r.name)) { history.replaceState(null, '', '#/' + NAV[role()][0][0]); }

  } catch (e) { console.error(e); toast(errMsg(e), true); render(); }
}

const clock = sec => { sec = Math.max(0, Math.floor(sec)); const p = n => String(n).padStart(2, '0'); return p(Math.floor(sec / 3600)) + ':' + p(Math.floor(sec % 3600 / 60)) + ':' + p(sec % 60); };

/* ───────────── Customer / enterprise bookings ───────────── */

function viewBooking(id){
  const j = S.jobs.find(x => String(x.id) === id);

  const owed = due(j);

  if (j.status === 'cancelled' && num(j.fee_kept) > 0) note = `<div class="notice warn">Cancelled less than ${num(S.settings.cancel_free_hours || 24)} hours before the visit, so a late cancellation fee of <b>${money(j.fee_kept)}</b> applies.</div>`;
  if (j.dispute === 'open') note = `<div class="notice warn"><b>You reported a problem</b> · ${esc(fmtTime(j.dispute_at))}<br>“${esc(j.dispute_note)}”<br>Taskadoo is looking into it and will contact you.</div>`;

    <p><a href="#/bookings">‹ All bookings</a></p>
    <div class="card">
      <div class="row"><div class="grow"><div class="tiny muted b">${esc(j.code)}</div><h2>${esc(fmtDate(j.job_date))}, ${esc(j.slot)}</h2></div><div>${statusChip(j, 'cust')}</div></div>
      ${!['cancelled','failed_visit'].includes(j.status) ? stepsBar(j) : ''}
      <dl class="kv" style="margin-top:12px">

        ${j.notes ? `<dt>Notes</dt><dd>${esc(j.notes)}</dd>` : ''}

    </div>
    ${note ? `<div style="margin-top:14px">${note}</div>` : ''}
    <div class="card">${itemsTable(j)}<div class="tot"><span>${CLOSED.includes(j.status) ? 'Booked total' : 'Total'}</span><span>${money(j.total)}</span></div>
      ${num(j.refund) > 0 ? `<table class="lines" style="margin-top:8px"><tr><td>Refund</td><td class="r">−${money(j.refund)}</td></tr></table>` : ''}
      ${CLOSED.includes(j.status) && (owed > 0 || j.paid) ? `<div class="row" style="justify-content:space-between;margin-top:10px"><span class="b">Amount due</span><span class="b" style="font-size:17px">${money(owed)}</span></div>

    </div>
    ${photosBlock(j, 'Proof of completion')}

        <div class="row"><button class="btn" data-act="report" data-id="${j.id}">Send to Taskadoo</button><button class="btn ghost" data-act="reportx">Never mind</button></div></div>`

/* ───────────── Dispatch (dispatcher + admin) ───────────── */
const needsCrew = j => j.status === 'new' || (j.status === 'assigned' && num(j.crew) > 1 && !j.helper_id);
const attention = j => j.status === 'issue' || j.dispute === 'open';
const DFILTERS = [
  ['attention', 'Needs attention', attention],
  ['needs', 'Needs assembler', needsCrew],
  ['waiting', 'Waiting to accept', j => j.status === 'assigned' && !needsCrew(j)],
  ['confirmed', 'Confirmed', j => j.status === 'accepted'],
  ['active', 'In progress', j => ['travelling','arrived','in_progress','finished'].includes(j.status)],
  ['done', 'Completed', j => j.status === 'done'],
  ['cancelled', 'Cancelled / missed', j => ['cancelled','failed_visit'].includes(j.status)],
  ['all', 'All', () => true]
];
function viewDispatch(id){
  const t = todayISO();
  const dateOk = j => S.dDate === 'all' || (S.dDate === 'today' ? j.job_date === t : j.job_date >= t);
  const base = S.jobs.filter(j => dateOk(j) || attention(j));
  if (!S.dFilterSet && base.some(attention)) S.dFilter = 'attention';
  const f = DFILTERS.find(x => x[0] === S.dFilter) || DFILTERS[1];
  const list = base.filter(f[2]).sort((a, b) => (a.job_date + a.slot).localeCompare(b.job_date + b.slot) || a.id - b.id);
  const sel = id ? S.jobs.find(j => String(j.id) === id) : null;
  const today = S.jobs.filter(j => j.job_date === t && j.status !== 'cancelled');
  const kpi = [['Jobs today', today.length], ['Needs assembler', S.jobs.filter(j => j.job_date >= t && needsCrew(j)).length],
    ['In progress', S.jobs.filter(j => ['travelling','arrived','in_progress','finished'].includes(j.status)).length],
    ['Needs attention', S.jobs.filter(attention).length]];
  return `
  <div class="row" style="margin-bottom:14px"><div class="grow"><h1>Dispatch</h1><div class="muted">${esc(fmtDate(t))} · ${S.jobs.length} jobs loaded</div></div>
    <select id="d_date" data-in="dDate" style="width:auto"><option value="upcoming" ${S.dDate === 'upcoming' ? 'selected' : ''}>Today &amp; upcoming</option>
      <option value="today" ${S.dDate === 'today' ? 'selected' : ''}>Today only</option><option value="all" ${S.dDate === 'all' ? 'selected' : ''}>All dates</option></select>
    <button class="btn ghost small" data-act="reload">↻ Refresh</button></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">
    ${kpi.map(k => `<div class="card" style="padding:14px${k[0] === 'Needs attention' && k[1] ? ';border:2px solid var(--orange)' : ''}"><div class="tiny muted b">${esc(k[0])}</div><div class="big">${k[1]}</div></div>`).join('')}</div>
  <div class="pills" style="margin-bottom:14px">${DFILTERS.map(x => `<button class="pill ${S.dFilter === x[0] ? 'on' : ''}" data-act="dfilter" data-v="${x[0]}">${esc(x[1])}<span class="n">${base.filter(x[2]).length}</span></button>`).join('')}</div>
  <div class="split ${sel ? 'has-sel' : ''}">
    <div class="list">${list.length ? list.map(j => `<a class="li ${sel && sel.id === j.id ? 'on' : ''}" href="#/job/${j.id}">
      <div class="row"><div class="grow"><div class="tiny muted b">${esc(j.code)} · ${esc(j.source === 'enterprise' ? (j.company || 'Enterprise') : j.source === 'staff' ? 'Staff booking' : 'Customer')}</div>
        <div class="b">${esc(itemsSummary(j))}</div>
        <div class="tiny muted">${esc(fmtDate(j.job_date))}, ${esc(j.slot)} · ${esc(j.area || '')} · ${esc(j.customer_name)}</div>
        <div class="tiny" style="margin-top:3px">${num(j.crew) > 1 ? '👥 ' + j.crew + '-person' : '👤 1 assembler'}${j.lead_name ? ' · ' + esc(j.lead_name) + (j.lead_ok ? ' ✓' : '') : ''}${j.helper_name ? ' + ' + esc(j.helper_name) + (j.helper_ok ? ' ✓' : '') : ''}</div></div>
        <div style="text-align:right">${statusChip(j)}<div class="b" style="margin-top:4px">${money(j.total)}</div></div></div></a>`).join('')
      : `<div class="card empty"><div class="ic">🎉</div>Nothing here.</div>`}</div>
    <div class="sticky">${sel ? '<a class="backsm" href="#/dispatch">‹ All jobs</a>' + jobPanel(sel) : `<div class="card empty"><div class="ic">👈</div>Pick a job to see details and assign assemblers.</div>`}</div>
  </div>`;
}

      <dt>Address</dt><dd><a href="${mapHref(j.address + ' ' + j.area)}" target="_blank" rel="noopener">${esc(j.address)}${j.area ? ', ' + esc(j.area) : ''}</a></dd>

      <label class="f"><span>Lead ${acc(j.lead_ok, j.lead_name)}</span><select id="as_lead">${opt(j.lead_id)}</select></label>

      ${!asm.length ? `<div class="notice warn" style="margin-bottom:10px">No active assemblers yet. ${role() === 'admin' ? 'Approve one in <a href="#/users">Users</a>.' : 'Ask Admin to approve assemblers.'}</div>` : ''}

// Taskadoo decides on "customer didn't sign" and reported problems
function decideCard(j){
  const open = attention(j), redo = S.jobs.find(x => x.revisit_of === j.id);
  if (!open) return j.resolution ? `<div class="card" style="border:2px solid var(--green)"><h3 style="margin-bottom:6px">Decision</h3>

  const opts = issue ? [['accepted', 'Customer confirmed – the job is done'], ['revisit', 'Free re-visit to fix it'], ['partial', 'Partial refund'], ['full', 'Full refund']]

    <div class="small muted" style="margin:10px 0">Look at the photos below, call the customer and the assembler, then decide. The assembler's payout stays on hold until you do.</div>
    <div class="choice">${opts.map(o => `<button data-act="resopt" data-v="${o[0]}" class="${S.resOpt === o[0] ? 'on' : ''}">${esc(o[1])}${o[0] === 'revisit' ? '<small>Creates a new ₱0 job for the same address – assign it like any job</small>' : ''}</button>`).join('')}</div>
    ${S.resOpt === 'partial' ? `<label class="f"><span>Refund amount (${cur()})</span><input id="res_amt" type="number" min="1" max="${num(j.total) - 1}" step="10"></label>` : ''}
    <label class="f"><span>Note – what was decided and why</span><textarea id="res_note" placeholder="Example: called the customer, door was misaligned, Juan goes back tomorrow"></textarea></label>
    <button class="btn" data-act="resolve" data-id="${j.id}" ${S.resOpt ? '' : 'disabled'}>Save decision</button></div>`;
}
const eventsList = j => (j.events || []).slice().reverse().map(e => `<div><span class="b">${esc(EVENT_LABEL[e.action] || e.action)}</span>${e.note ? ' – ' + esc(e.note) : ''}

        <label class="f"><span>What happened</span><textarea id="nh_note" placeholder="Example: called twice at 2:10 and 2:15, no answer, guard says they're out">${esc(S.nhNote || '')}</textarea></label>

      <div class="row"><div class="grow"><div class="tiny muted b">${esc(j.code)} · ${lead ? 'You are lead' : 'Extra assembler'}</div><h2>${esc(itemsSummary(j))}</h2></div>${statusChip(j)}</div>

    </div>
    <div class="card">${step}</div>
    <div class="card">${itemsTable(j)}</div>
    ${photosBlock(j)}
  </div>`;
}

/* ───────────── Admin: payments ───────────── */
function viewPayments(){
  const rows = S.jobs.filter(j => due(j) > 0 || num(j.refund) > 0 || attention(j))
    .sort((a, b) => (a.paid - b.paid) || String(b.completed_at || b.updated_at).localeCompare(String(a.completed_at || a.updated_at)));
  const tot = rows.reduce((a, j) => { const s = split(j); a.g += s.total; a.c += s.cut; a.p += s.pool; if (!j.paid) a.u += due(j); a.r += num(j.refund); return a; }, { g: 0, c: 0, p: 0, u: 0, r: 0 });

/* ───────────── Photos & signature ───────────── */
function compress(file, max = 1600){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read the photo.')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a photo we can read.')); };
    img.src = url;
  });
}
const rid = () => Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
let sig = { drawn: false };
function sigPad(c){
  const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#262261';
  sig = { drawn: false, c }; let down = false, last = null;
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { down = true; last = pt(e); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (!down) return; const p = pt(e); x.beginPath(); x.moveTo(last[0], last[1]); x.lineTo(p[0], p[1]); x.stroke(); last = p; sig.drawn = true; };
  c.onpointerup = c.onpointercancel = () => { down = false; };
}

// Tests fixed after a reported problem: id → ISO time of the fix. They come back first as "please test again".
const WN_FIXED = {};

const wnKey = () => 'tk_wn_seen_' + (S.me ? S.me.id : '');
const wnLatest = () => WHATSNEW.reduce((m, x) => (x.d + x.v > m ? x.d + x.v : m), '');
const wnFor = c => c.for.includes('all') || c.for.includes(role()) || (role() === 'admin');
function wnVisible(){ return WHATSNEW.map(r => Object.assign({}, r, { changes: r.changes.filter(wnFor) })).filter(r => r.changes.length); }
function wnUnseen(){ if (!S.me || !wnVisible().length) return false; try { return (localStorage.getItem(wnKey()) || '') < wnLatest(); } catch (e) { return false; } }
const longDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });

/* test results (staging): table test_results, shared by everyone testing */
const TR = { map: {}, loaded: false, loading: false, err: '' };
const TG = { i: null, open: false, note: null, typing: false };
const isTestSite = () => !!CFG.STAGING;
const tsAll = () => Object.entries(WN_TESTS).flatMap(([v, L]) => L.map(t => ({ v, t })));
const titleOf = v => (WHATSNEW.find(r => r.v === v) || {}).title || v;
async function tsLoad(){
  if (TR.loading) return; TR.loading = true;
  try { const d = await api.testResults(); TR.map = {}; (d || []).forEach(r => TR.map[r.id] = r); TR.err = ''; }
  catch (e) { TR.err = /relation|does not exist|schema cache|permission denied/i.test(errMsg(e)) ? 'setup' : 'load'; console.warn(e); }
  TR.loading = false; TR.loaded = true;
  if (route().name === 'whatsnew' || route().name === 'tests') render(); else tgPaint();
}
async function tsSave(id, patch, quiet){
  const cur = TR.map[id] || { status: '', note: '' };
  const row = Object.assign({ id, status: cur.status || '', note: cur.note || '' }, patch, { by: S.me.id, by_name: S.me.full_name || S.me.email, at: new Date().toISOString() });
  TR.map[id] = row;
  if (!quiet) { if (route().name === 'whatsnew') render(); else tgPaint(); }
  try { await api.saveTest(row); } catch (e) { toast(TR.err === 'setup' || /relation|does not exist|schema cache/i.test(errMsg(e)) ? 'Results can\'t be saved yet: run the test-results SQL in Supabase first.' : 'Couldn\'t save: ' + errMsg(e), true); await tsLoad(); }
}
const TG_ROLE = { customer: 'customer', assembler: 'assembler', dispatcher: 'dispatcher', enterprise: 'enterprise', admin: 'admin' };
function tsMine(t){
  const who = t[1].toLowerCase();
  if (S.me.role === 'admin' && !inPreview()) return true;
  if (/everyone/.test(who)) return true;
  return Object.entries(TG_ROLE).some(([w, r]) => who.includes(w) && role() === r);
}
const tsMineId = id => { const x = tsAll().find(({ t }) => t[0] === id); return !!x && tsMine(x.t); };
const tgRetest = id => { const f = WN_FIXED[id], r = TR.map[id]; return !!f && !!r && r.status === 'fail' && r.at < f; };
// oldest release first: accounts and a booking come before newer features
function tgList(){ const L = tsAll().filter(({ t }) => tsMine(t)).sort((x, y) => parseFloat(x.v) - parseFloat(y.v)); return [...L.filter(x => tgRetest(x.t[0])), ...L.filter(x => !tgRetest(x.t[0]))]; }
const tgOpenTest = x => !(TR.map[x.t[0]] || {}).status || tgRetest(x.t[0]);
const tgLeft = () => tgList().filter(tgOpenTest).length;
function tgStart(){ const L = tgList(), k = L.findIndex(tgOpenTest); TG.i = k < 0 ? L.length : k; }
function tsCounts(list){ const c = { pass: 0, fail: 0, skip: 0, left: 0 }; (list || tsAll()).forEach(({ t }) => { const s = (TR.map[t[0]] || {}).status; c[s || 'left']++; }); return c; }
const STLABEL = { pass: 'Worked', fail: 'Problem', skip: 'Skipped' };
function tsMeta(r){ return r && r.at && (r.status || r.note) ? `${r.status ? STLABEL[r.status] : 'Note'} · ${esc(r.by_name || 'Someone')} · ${esc(fmtTime(r.at))}` : ''; }
function tsShow(id){ const f = S.wnF || 'all', s = (TR.map[id] || {}).status || ''; return f === 'all' || (f === 'mine' && tsMineId(id)) || (f === 'left' && !s) || (f === 'fail' && s === 'fail'); }
function tsRow(t){
  const [id, who, title, steps, exp] = t, r = TR.map[id] || {}, s = r.status || '';
  return `<div class="ts ${s ? 'is-' + s : ''}"><div style="min-width:0"><h4><span class="tid">${esc(id)}</span>${esc(title)}<span class="who">${esc(who)}</span></h4>
    ${WN_SETUP[id] ? `<div class="tiny" style="color:var(--orange);font-weight:800">Before you start: ${esc(WN_SETUP[id])}</div>` : ''}
    <ol>${steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol><p class="exp"><b>Should happen:</b> ${esc(exp)}</p></div>
    <div><div class="seg">${[['pass', 'Worked'], ['fail', 'Problem'], ['skip', 'Skip']].map(([k, l]) => `<button data-act="tsset" data-id="${esc(id)}" data-v="${k}" aria-pressed="${s === k}">${l}</button>`).join('')}</div>
    <textarea id="ts-note-${esc(id)}" data-tsnote="${esc(id)}" placeholder="What did you see? (optional)">${esc(r.note || '')}</textarea>
    <div class="meta">${tsMeta(r)}</div></div></div>`;
}
function tsBlock(v){
  const L = WN_TESTS[v]; if (!L || !isTestSite()) return '';
  const vis = L.filter(t => tsShow(t[0])); if ((S.wnF || 'all') !== 'all' && !vis.length) return '';
  const done = L.filter(t => (TR.map[t[0]] || {}).status).length, fail = L.filter(t => (TR.map[t[0]] || {}).status === 'fail').length;
  const open = (S.wnF || 'all') !== 'all' || (S.wnOpen || {})[v];
  return `<details class="wn-tests" data-wn="${esc(v)}" ${open ? 'open' : ''}><summary>Test this <span class="small muted">${done} of ${L.length} done${fail ? ` · <span style="color:var(--red)">${fail} with a problem</span>` : ''}</span></summary>${vis.map(tsRow).join('')}</details>`;
}
function tsSummary(){
  if (!isTestSite()) return '';
  if (!TR.loaded && !TR.loading) tsLoad();
  if (TR.err === 'setup') return `<div class="notice warn" style="margin-bottom:14px"><b>Test results aren't set up yet.</b> An Admin needs to run <code>supabase/sql/2026-10-17_test_results.sql</code> in the staging Supabase SQL editor. You can still read the tests below.</div>`;
  if (!S.wnF) S.wnF = S.me.role === 'admin' && !inPreview() ? 'all' : 'mine';
  const c = tsCounts(), f = S.wnF, chip = (k, l) => `<button class="pill ${f === k ? 'on' : ''}" data-act="tsfilter" data-v="${k}">${l}</button>`;
  return `<div class="card" style="margin-bottom:16px"><div class="wn-sum"><div class="c p"><b>${c.pass}</b><span>Worked</span></div><div class="c f"><b>${c.fail}</b><span>Problems</span></div>
      <div class="c"><b>${c.skip}</b><span>Skipped</span></div><div class="c"><b>${c.left}</b><span>Not tested</span></div></div>
    <div class="row" style="margin-bottom:10px"><button class="btn" data-act="tgopen">🧪 Start testing</button><button class="btn ghost small" data-act="tgtab">Open in new tab ↗</button>
      ${S.me.role === 'admin' ? `<button class="btn ghost small" data-act="tscopy">Copy results for Claude</button><button class="btn ghost small" data-act="tsdl">Download</button>` : ''}
      <button class="btn ghost small" data-act="tsreload">↻ Refresh</button></div>
    <div class="pills">${chip('mine', 'My tests')}${chip('all', 'All tests')}${chip('left', 'Not tested yet')}${chip('fail', 'Problems')}</div></div>`;
}
function tsReport(){
  const c = tsCounts(), A = tsAll();
  const line = ({ v, t }) => { const r = TR.map[t[0]] || {}; return `- ${t[0]} ${t[2]} (v${v} ${titleOf(v)}; ${t[1]})${r.note ? ': ' + r.note.replace(/\s+/g, ' ') : ''}${r.by_name ? ` [${r.by_name}, ${fmtTime(r.at)}]` : ''}`; };
  const by = s => A.filter(x => ((TR.map[x.t[0]] || {}).status || '') === s);
  const list = arr => (arr.length ? arr.map(line) : ['- none']);
  return [`Taskadoo test results (staging), ${new Date().toLocaleString('en-PH')}`, `Worked ${c.pass}, Problems ${c.fail}, Skipped ${c.skip}, Not tested ${c.left} (of ${A.length})`, '',
    'PROBLEMS:', ...list(by('fail')), '', 'SKIPPED:', ...list(by('skip')), '',
    'WORKED: ' + (by('pass').map(x => x.t[0]).join(', ') || 'none'), 'NOT TESTED: ' + (by('').map(x => x.t[0]).join(', ') || 'none'), '',
    'Notes on tests that worked:', ...list(by('pass').filter(x => (TR.map[x.t[0]] || {}).note))].join('\n');
}
function saveFile(name, text){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

function viewWhatsNew(){
  try { localStorage.setItem(wnKey(), wnLatest()); } catch (e) {}
  const rel = wnVisible();
  return `<div class="narrow" style="max-width:820px">
    <h1>What's new</h1>
    <p class="muted" style="margin-top:4px">New features, improvements and fixes, newest first. You see the changes for the screens you use.${isTestSite() ? ' "Staging" items are only on the test site for now. Open <b>Test this</b> under an update to try it and record what happened.' : ''}</p>
    ${tsSummary()}
    ${rel.length ? rel.map(r => `<section class="wn-rel">
      <div class="row" style="align-items:baseline"><span class="wn-v">v${esc(r.v)}</span><h2 class="grow">${esc(r.title)}</h2>
        ${r.where === 'staging' && isTestSite() ? '<span class="chip orange">Staging</span>' : ''}<span class="tiny muted">${esc(longDate(r.d))}</span></div>
      <div style="margin-top:8px">${r.changes.map(c => `<div class="wn-ch"><span class="kind ${esc(c.k)}">${esc(c.k)}</span><span>${esc(c.t)}</span></div>`).join('')}</div>
      ${tsBlock(r.v)}</section>`).join('') : '<div class="card empty">No updates yet.</div>'}
  </div>`;
}

/* guided testing: one test at a time, big plain buttons */
function tgIntroSeen(){ try { return !!localStorage.getItem('tk_tg_intro'); } catch (e) { return true; } }
function tgHtml(){
  if (TR.err === 'setup') return `<div class="tg-setup"><b>Testing isn't set up yet.</b> An Admin needs to run the test-results SQL in Supabase first.</div>`;
  if (!TR.loaded) return `<div class="muted">Loading tests…</div>`;
  const L = tgList();
  if (!tgIntroSeen()) return `<div class="tg-card"><h2>Before you start</h2>
    <ul><li><b>You need:</b> your phone 📱, a computer 💻 if you have one, and your login for the staging site.</li>
    <li>We show you <b>one test at a time</b>. Follow the steps, then tap <b>It worked</b> or <b>Something's wrong</b>.</li>
    <li>If something's wrong, write what you saw in your own words. That's all we need.</li>
    <li>You only get the tests for the account you're signed in with (${esc(ROLE_LABEL[role()])}). Tests for other roles need an account with that role.</li>
    <li>This is a practice site with practice data. Nobody real is booked or paid, so you can't break anything.</li></ul>
    <div class="tg-btns"><button class="ok" data-act="tgintro">Start testing</button></div></div>`;
  if (TG.i == null) tgStart();
  const done = L.filter(x => !tgOpenTest(x)).length, pct = L.length ? Math.round(done / L.length * 100) : 100;
  const prog = `<div class="small muted">${done} of ${L.length} done</div><div class="tg-prog"><i style="width:${pct}%"></i></div>`;
  if (TG.i >= L.length) { const c = tsCounts(L), left = tgLeft();
    return `${prog}<div class="tg-card"><h2>${left ? 'You\'ve reached the end' : 'All done. Thank you!'}</h2>
      <p style="margin:0">${left ? `${left} test${left > 1 ? 's are' : ' is'} still open. Tap Back to the first open test to finish them.` : 'Every test for you has a result. Tell Dennis you\'re finished.'}</p>
      <div class="tg-exp">Worked ${c.pass} · Problems ${c.fail} · Skipped ${c.skip}</div>
      <div class="tg-btns">${left ? '<button class="ok" data-act="tgfirst">Back to the first open test</button>' : ''}<button data-act="tgprev">‹ Go back one test</button>
      ${S.me.role === 'admin' ? '<button data-act="tscopy">Copy results for Claude</button>' : ''}</div></div>`; }
  const { v, t } = L[TG.i], [id, who, title, steps, exp] = t, r = TR.map[id] || {}, st = tgRetest(id) ? '' : (r.status || ''), setup = WN_SETUP[id];
  const where = /assembler/i.test(who) ? '📱 On your phone' : /customer|everyone/i.test(who) ? '📱 Phone or 💻 computer' : '💻 On the computer (a phone works too)';
  return `${prog}<div class="tg-card" data-id="${esc(id)}">
    <div class="tg-upd">Test ${TG.i + 1} of ${L.length} · v${esc(v)} ${esc(titleOf(v))} · ${esc(id)} · ${esc(who)}</div>
    ${tgRetest(id) ? '<div class="tg-fixed">We fixed this. Please try it again.</div>' : ''}
    <h2>${esc(title)}</h2>

function tgPaint(){

  if (!pn) { pn = document.createElement('div'); pn.id = 'tg-panel'; pn.className = 'tg-panel'; document.body.appendChild(pn); }
  const on = isTestSite() && !!S.me && S.me.active && route().name !== 'tests' && !S.recovery;
  if (!on) { fab.hidden = true; pn.hidden = true; return; }
  if (!TR.loaded && !TR.loading) tsLoad();
  const left = TR.loaded ? tgLeft() : 0;

    if (S.resOpt === 'full' && !confirm('Refund the full amount?')) return;
    const r = await api.rpc('resolve_job', { p_job: id, p_outcome: S.resOpt, p_amount: num(val('res_amt')), p_note: val('res_note') });
    S.resOpt = null; await reloadJob(id); if (r && r.revisit_id) await reloadJob(r.revisit_id);
    toast(r && r.revisit_id ? 'Decision saved – re-visit job created. Assign it now.' : 'Decision saved'); render(); }); },
  gotoattention(b, e){ e.preventDefault(); S.dFilter = 'attention'; S.dFilterSet = true; go('dispatch'); },
};
const CHANGE = {
  pvswitch(el){ const v = el.value; if (v.startsWith('r:')) pvRole(v.slice(2)); else pvPerson(v.slice(2)); },
  async photos(el){
    const id = Number(el.dataset.id), files = [...el.files]; if (!files.length) return;
    const label = el.closest('label'); if (label) { label.style.opacity = .6; label.firstChild.textContent = 'Uploading… '; }
    try {
      for (const f of files) {
        const blob = await compress(f), path = id + '/' + rid() + '.jpg';
        await api.upload(path, blob, 'image/jpeg');
        await api.rpc('job_action', { p_job: id, p_action: 'photo', p: { path } });
      }
      await reloadJob(id); toast(files.length > 1 ? files.length + ' photos added' : 'Photo added');
    } catch (e) { console.warn(e); toast(errMsg(e), true); }
    render();
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); } return; }
  if (b.classList.contains('modal-bg') && e.target !== b) return; // clicks inside the edit window don't close it
  const f = ACT[b.dataset.act]; if (f) { if (b.tagName === 'A') e.preventDefault(); f(b, e); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  S[k] = e.target.value;
  if (k === 'search' || k === 'uSearch' || k === 'pvSearch' || k === 'cSearch') { const pos = e.target.selectionStart; render(); const el = document.querySelector('[data-in="' + k + '"]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }
  if (k === 'dDate') render();
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !S.sd) return;
  if (t.dataset.sd != null) { S.sd[t.dataset.sd] = t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value; sdPaint(); }
  if (t.dataset.cat != null) { S.sd.categories[Number(t.dataset.cat)].name = t.value; sdPaint(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.sd != null && S.sd && t.tagName === 'SELECT') { S.sd[t.dataset.sd] = t.value; sdPaint(); render(); } });
document.addEventListener('input', e => { if (e.target.id === 'nh_note') S.nhNote = e.target.value; });
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-nh]')) S.nhOpen = e.target.open; }, true);
const noteT = {};
document.addEventListener('input', e => {
  const t = e.target, id = t.dataset && t.dataset.tsnote; if (id == null) return;
  clearTimeout(noteT[id]); TG.typing = true;
  noteT[id] = setTimeout(() => { TG.typing = false; const v = t.value.slice(0, 2000);
    if (v !== ((TR.map[id] || {}).note || '')) tsSave(id, { note: v }, true).then(() => { const m = t.closest('.ts,.tg-card'); const el = m && m.querySelector('.meta,.tg-saved'); if (el) el.textContent = 'Note saved · ' + fmtTime(new Date().toISOString()); }); }, 900);
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.wn-tests') && (S.wnF || 'all') === 'all') S.wnOpen = Object.assign(S.wnOpen || {}, { [d.dataset.wn]: d.open }); }, true);
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.change; if (k && CHANGE[k]) CHANGE[k](e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.auth') && e.target.tagName === 'INPUT') { const b = document.querySelector('.auth .btn[data-act]'); if (b) b.click(); } });
window.addEventListener('hashchange', async () => {
  S.menu = false; S.resOpt = null; S.report = null; S.noSign = null; S.editItem = null;
  const r = route();
  if (S.me && isStaff() && r.name === 'job') { const j = S.jobs.find(x => String(x.id) === r.arg); try { await loadAssemblers(j ? j.job_date : null); } catch (e) { console.warn(e); } }
  render(); if (!['job'].includes(r.name)) window.scrollTo(0, 0);
});
/* light auto-refresh for lists (skipped while typing) */
setInterval(async () => {
  if (!S.me || document.hidden) return;
  const r = route().name;
  if (!['tasks','bookings','dispatch','booking'].includes(r)) return;
  const a = document.activeElement; if (a && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName)) return;
  try { await loadJobs(); if (route().name === r) render(); } catch (e) { console.warn(e); }
}, 45000);
boot();
</script>
