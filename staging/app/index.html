<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskadoo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#262261">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taskadoo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#262261; --blue:#0E77BA; --blue-soft:#E2F0FA; --bg:#ECE9E2; --card:#fff; --soft:#FAF8F3;
  --line:#EFEBE3; --line2:#E0DBD1; --text:#55505F; --muted:#8E8896; --faint:#A39EAC;
  --green:#15875A; --green-soft:#DFF1E9; --orange:#E8772E; --orange-soft:#FAE6D5; --red:#C62828; --red-soft:#FCE4E4;
  --radius:18px; --shadow:0 1px 2px rgba(38,34,97,.06),0 6px 24px rgba(38,34,97,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue)}
h1,h2,h3{color:var(--ink);margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:900} h2{font-size:20px;font-weight:800} h3{font-size:16px;font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;border:1px solid var(--line2);background:var(--soft);border-radius:12px;padding:11px 12px;font-weight:600;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff}
textarea{min-height:80px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.green{background:var(--green)}
.btn.red{background:#fff;color:var(--red);border:1px solid #F1C4C4}
.btn.small{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.b{font-weight:800;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.grid2>.card,.grid2>.card+.card{margin-top:0}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:var(--soft);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.orange{background:var(--orange-soft);color:var(--orange);border-color:transparent}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.ink{background:var(--ink);color:#fff;border-color:transparent}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pill{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill .n{opacity:.6;margin-left:4px}
/* layout */
.top{position:sticky;top:0;z-index:20;background:rgba(236,233,226,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.top img.logo{height:26px;display:block}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.nav a{padding:8px 12px;border-radius:10px;font-weight:800;color:var(--text);text-decoration:none;white-space:nowrap;font-size:14.5px}
.nav a.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;cursor:pointer;border:0}
.main{max-width:1200px;margin:0 auto;padding:20px 16px 110px}
.narrow{max-width:640px;margin:0 auto}
.bottom{display:none}
.menu{position:absolute;right:16px;top:54px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;min-width:220px;z-index:30}
.menu .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none}
.menu .mi:hover{background:var(--soft)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.sticky{position:sticky;top:76px}
.backsm{display:none;margin-bottom:10px}
.list>.li{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;color:inherit;text-decoration:none}
.list>.li+.li{margin-top:8px}
.list>.li.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv>dt{color:var(--muted);font-weight:700} .kv>dd{margin:0;color:var(--ink);font-weight:700;word-break:break-word}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:7px 0;border-bottom:1px dashed var(--line2);vertical-align:top}
.lines td.r{text-align:right;white-space:nowrap;font-weight:800;color:var(--ink)}
.lines tr:last-child td{border-bottom:0}
.tot{display:flex;justify-content:space-between;font-weight:900;color:var(--ink);font-size:17px;padding-top:10px;border-top:2px solid var(--ink);margin-top:6px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:6px}
.notice{border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--blue-soft);color:var(--ink)}
.notice.warn{background:var(--orange-soft)} .notice.ok{background:var(--green-soft)} .notice.bad{background:var(--red-soft);color:var(--red)}
/* catalogue */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.item .em{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:24px}
.item .nm{font-weight:800;color:var(--ink);line-height:1.25}
.item .fee{font-weight:900;color:var(--ink);font-size:17px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.qty button{border:0;background:none;width:34px;height:34px;font-weight:900;font-size:18px;cursor:pointer;color:var(--ink)}
.qty span{min-width:26px;text-align:center;font-weight:900;color:var(--ink)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--ink);color:#fff}
.cartbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.cartbar .btn{background:#fff;color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:11px 8px;font-weight:800;cursor:pointer;color:var(--ink)}
.slot.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* timeline */
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps i{flex:1;height:6px;border-radius:4px;background:var(--line2)}
.steps i.on{background:var(--green)}
.events{font-size:13px;color:var(--muted)}
.events div{padding:4px 0;border-bottom:1px solid var(--line)}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photos a,.photos .ph{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.sig{width:100%;height:180px;border:2px dashed var(--line2);border-radius:14px;background:#fff;touch-action:none;display:block}
.big{font-size:28px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.money{font-weight:900;color:var(--green)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:8px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input,.tbl select{padding:7px 8px;border-radius:9px}
.scroll{overflow-x:auto}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth .card{width:100%;max-width:420px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs2 button{border:0;background:none;padding:9px;border-radius:9px;font-weight:800;cursor:pointer;color:var(--muted)}
.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.choice{display:grid;gap:8px;margin-bottom:12px}
.choice button{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;font-weight:800;color:var(--ink)}
.choice button.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.choice small{display:block;font-weight:600;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:800;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--red)}
.stagebadge{position:fixed;left:10px;bottom:10px;z-index:70;background:#d32f2f;color:#fff;font:800 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.08em;padding:5px 10px;border-radius:999px;pointer-events:none}
.offer{border:2px solid var(--orange);border-radius:18px;background:#fff;padding:16px}
.timer{font-size:40px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@media (max-width:860px){
  .split{grid-template-columns:1fr}
  .sticky{position:static}
  .nav{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:24;background:#fff;border-top:1px solid var(--line2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom a{flex:1;text-align:center;padding:7px 2px;border-radius:10px;font-weight:800;font-size:12px;color:var(--muted);text-decoration:none}
  .bottom a .i{display:block;font-size:19px;line-height:1.2}
  .bottom a.on{color:var(--ink);background:var(--blue-soft)}
  .has-bottom .cartbar{bottom:calc(58px + env(safe-area-inset-bottom))}
  .grid2{grid-template-columns:1fr}
  h1{font-size:23px}
  .stagebadge{bottom:auto;top:18px;left:auto;right:60px}
  .split.has-sel>.list{display:none}
  .backsm{display:inline-block!important}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="app"><div class="auth"><div class="muted">Loading…</div></div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ───────────── Data access (all Supabase calls live here) ───────────── */
const CFG = window.TASKADOO_CONFIG || {};
const sb = window.__MOCK_API ? null : window.supabase.createClient(CFG.url, CFG.key);
async function q(p){ const { data, error } = await p; if (error) throw error; return data; }
const here = () => location.origin + location.pathname;
const api = window.__MOCK_API || {
  async session(){ return (await q(sb.auth.getSession())).session; },
  onAuth(cb){ sb.auth.onAuthStateChange((ev, s) => cb(ev, s)); },
  signIn: (email, password) => q(sb.auth.signInWithPassword({ email, password })),
  signUp: (email, password, meta) => q(sb.auth.signUp({ email, password, options: { data: meta, emailRedirectTo: here() } })),
  signOut: () => sb.auth.signOut(),
  resetPassword: email => q(sb.auth.resetPasswordForEmail(email, { redirectTo: here() })),
  setPassword: password => q(sb.auth.updateUser({ password })),
  me: uid => q(sb.from('profiles').select('*').eq('id', uid).maybeSingle()),
  updateProfile: (id, f) => q(sb.from('profiles').update(f).eq('id', id).select().maybeSingle()),
  profiles: () => q(sb.from('profiles').select('*').order('created_at', { ascending: false })),
  async settings(){ const r = await q(sb.from('settings').select('value').eq('key', 'main').maybeSingle()); return r ? r.value : {}; },
  saveSettings: v => q(sb.from('settings').upsert({ key: 'main', value: v, updated_at: new Date().toISOString() })),
  catalog: () => q(sb.from('catalog').select('*').order('cat').order('name')),
  saveItem(it){
    const { id, ...f } = it;
    return id ? q(sb.from('catalog').update(f).eq('id', id)) : q(sb.from('catalog').insert(f));
  },
  jobs: () => q(sb.from('jobs').select('*').order('job_date', { ascending: false }).order('id', { ascending: false }).limit(1000)),
  job: id => q(sb.from('jobs').select('*').eq('id', id).maybeSingle()),
  rpc: (fn, args) => q(sb.rpc(fn, args)),
  async upload(path, blob, type){ await q(sb.storage.from('jobs').upload(path, blob, { contentType: type, upsert: false })); },
  async signedUrls(paths){
    if (!paths.length) return {};
    const d = await q(sb.storage.from('jobs').createSignedUrls(paths, 3600));
    const m = {}; (d || []).forEach(x => { if (x.signedUrl) m[x.path] = x.signedUrl; }); return m;
  }
};

/* ───────────── Helpers ───────────── */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const cur = () => (S.settings.currency === 'THB' ? '฿' : '₱');
const money = v => cur() + Math.round(num(v)).toLocaleString('en-PH');
const todayISO = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); // Asia/Manila
const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const fmtDate = iso => iso ? new Date(String(iso).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const fmtTime = ts => ts ? new Date(ts).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const initials = n => (String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('') || '?').toUpperCase();
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const mins = m => { m = num(m); return m >= 60 ? (Math.round(m / 6) / 10) + 'h' : m + 'm'; };
const errMsg = e => (e && (e.message || e.error_description)) || String(e || 'Something went wrong');
const telHref = m => 'tel:' + String(m || '').replace(/[^\d+]/g, '');
const mapHref = a => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a || '');

function toast(msg, bad){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 4500 : 2600);
}
async function busy(btn, fn){
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { console.warn(e); toast(errMsg(e), true); } finally { if (btn && btn.isConnected) btn.disabled = false; }
}

/* Money split for a job (snapshot of commission / lead share taken at booking) */
function split(j){
  const total = num(j.total), cut = total * num(j.commission_pct) / 100, pool = total - cut;
  const two = !!j.helper_id || num(j.crew) > 1;
  const lead = two ? pool * num(j.lead_pct) / 100 : pool;
  return { total, cut, pool, lead, helper: two ? pool - lead : 0, two };
}
const myShare = j => { const s = split(j); return j.lead_id === S.me.id ? s.lead : j.helper_id === S.me.id ? s.helper : 0; };

const STATUS = {
  new:        { staff: 'Needs assembler',  cust: 'Booked – finding your assembler', c: 'orange' },
  assigned:   { staff: 'Waiting to accept', cust: 'Confirming your assembler', c: 'blue' },
  accepted:   { staff: 'Confirmed', cust: 'Confirmed', c: 'green' },
  travelling: { staff: 'On the way', cust: 'Assembler on the way', c: 'blue' },
  arrived:    { staff: 'Arrived', cust: 'Assembler has arrived', c: 'blue' },
  in_progress:{ staff: 'Assembling', cust: 'Assembly in progress', c: 'blue' },
  finished:   { staff: 'Waiting for sign-off', cust: 'Ready for your sign-off', c: 'blue' },
  done:       { staff: 'Completed', cust: 'Completed', c: 'green' },
  cancelled:  { staff: 'Cancelled', cust: 'Cancelled', c: 'red' }
};
const STEP_ORDER = ['new','assigned','accepted','travelling','arrived','in_progress','finished','done'];
function statusChip(j, who){
  const s = STATUS[j.status] || { staff: j.status, cust: j.status, c: '' };
  let label = who === 'cust' ? s.cust : s.staff;
  if (who !== 'cust' && j.status === 'assigned' && num(j.crew) > 1 && !j.helper_id) label = 'Needs extra assembler';
  return `<span class="chip ${s.c}">${esc(label)}</span>`;
}
function stepsBar(j){
  const i = STEP_ORDER.indexOf(j.status);
  return `<div class="steps">${STEP_ORDER.slice(1).map((_, k) => `<i class="${i > k ? 'on' : ''}"></i>`).join('')}</div>`;
}
const EVENT_LABEL = { booked:'Booked', assigned:'Assigned', accepted:'Accepted', declined:'Declined', travel:'Started travelling',
  arrive:'Arrived', start:'Started assembly', finish:'Finished assembly', completed:'Signed off by customer', cancelled:'Cancelled',
  paid:'Marked paid', unpaid:'Marked unpaid' };
const ROLE_LABEL = { customer:'Customer', assembler:'Assembler', dispatcher:'Dispatcher', enterprise:'Enterprise', admin:'Admin' };

/* ───────────── State & routes ───────────── */
const S = { session: null, me: null, settings: {}, catalog: [], jobs: [], profiles: [], assemblers: [],
  cart: {}, cat: 'all', brand: 'All', search: '', slot: '', urls: {}, menu: false, authTab: 'in', want: '',
  dFilter: 'needs', dDate: 'upcoming', uFilter: 'all', recovery: false, loaded: {} };
try { S.cart = JSON.parse(localStorage.getItem('tk_cart') || '{}') || {}; } catch (e) { S.cart = {}; }
const saveCart = () => { try { localStorage.setItem('tk_cart', JSON.stringify(S.cart)); } catch (e) {} };

const NAV = {
  customer:   [['book','Book','🛠️'], ['bookings','My bookings','📋'], ['profile','Profile','👤']],
  enterprise: [['book','New booking','🛠️'], ['bookings','Bookings','📋'], ['profile','Account','🏢']],
  assembler:  [['tasks','Tasks','🧰'], ['earnings','Earnings','💰'], ['profile','Profile','👤']],
  dispatcher: [['dispatch','Dispatch','🧭'], ['book','New booking','🛠️'], ['profile','Profile','👤']],
  admin:      [['dispatch','Dispatch','🧭'], ['payments','Payments','💳'], ['catalog','Catalogue','📦'], ['users','Users','👥'],
               ['settings','Settings','⚙️'], ['book','New booking','🛠️'], ['profile','Profile','👤']]
};
const SUB = { booking: 'bookings', job: 'dispatch', task: 'tasks' };
function route(){ const h = location.hash.replace(/^#\/?/, '').split('/'); return { name: h[0] || '', arg: h[1] || '' }; }
const go = (name, arg) => { location.hash = '#/' + name + (arg ? '/' + arg : ''); };
const role = () => (S.me ? S.me.role : '');
const isStaff = () => ['admin','dispatcher'].includes(role());
function allowed(name){
  const tabs = (NAV[role()] || []).map(t => t[0]);
  return tabs.includes(name) || tabs.includes(SUB[name]) || (name === 'job' && isStaff());
}

/* ───────────── Loading ───────────── */
async function loadBase(){
  S.settings = (await api.settings()) || {};
  S.catalog = (await api.catalog()) || [];
}
async function loadJobs(){ S.jobs = (await api.jobs()) || []; S.loaded.jobs = Date.now(); }
async function loadProfiles(){ S.profiles = (await api.profiles()) || []; }
async function loadAssemblers(date){ S.assemblers = (await api.rpc('assembler_list', { p_date: date || null })) || []; }
async function refreshMe(){ S.me = await api.me(S.session.user.id); }

async function boot(){
  try {
    if (!window.__MOCK_API && !(window.supabase && CFG.url)) throw new Error('Could not load the app. Please check your internet connection and reload.');
    if (/type=recovery/.test(location.hash)) S.recovery = true;
    S.session = await api.session();
    api.onAuth(async (ev, s) => {
      if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; }
      const was = S.session && S.session.user.id;
      S.session = s;
      if (ev === 'SIGNED_OUT') { S.me = null; render(); return; }
      if (s && s.user.id !== was) { await afterLogin(); }
      else render();
    });
    await loadBase();
    if (S.session) await afterLogin(); else render();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="auth"><div class="card"><h2>Taskadoo</h2><p class="notice bad" style="margin-top:12px">${esc(errMsg(e))}</p>
      <button class="btn block" style="margin-top:12px" onclick="location.reload()">Reload</button></div></div>`;
  }
}
async function afterLogin(){
  try {
    await refreshMe();
    if (!S.me) { // profile is created by the database on sign-up; wait a moment once
      await new Promise(r => setTimeout(r, 1200)); await refreshMe();
    }
    if (!S.me) throw new Error('Your account is not ready yet. Please sign out and sign in again.');
    if (!S.me.active) { render(); return; }
    await loadJobs();
    if (role() === 'admin') await loadProfiles();
    if (isStaff()) await loadAssemblers(null);
    const r = route();
    if (!r.name || !allowed(r.name)) { history.replaceState(null, '', '#/' + NAV[role()][0][0]); }
    render();
  } catch (e) { console.error(e); toast(errMsg(e), true); render(); }
}

/* ───────────── Rendering ───────────── */
function render(){
  const app = $('#app');
  if (S.recovery && S.session) { app.innerHTML = viewNewPassword(); return; }
  if (!S.session) { app.innerHTML = viewAuth(); badge(); return; }
  if (!S.me) { app.innerHTML = `<div class="auth"><div class="card"><p class="muted">Loading your account…</p>
    <button class="btn ghost small" data-act="logout">Sign out</button></div></div>`; return; }
  if (!S.me.active) { app.innerHTML = `<div class="auth"><div class="card stack"><h2>Account paused</h2>
    <p>Your Taskadoo account is not active. Please contact Taskadoo support.</p><button class="btn ghost" data-act="logout">Sign out</button></div></div>`; return; }
  let r = route();
  if (!r.name || !allowed(r.name)) r = { name: NAV[role()][0][0], arg: '' };
  const V = { book: viewBook, bookings: viewBookings, booking: viewBooking, dispatch: viewDispatch, job: viewDispatch,
    tasks: viewTasks, task: viewTask, earnings: viewEarnings, profile: viewProfile, catalog: viewCatalog, users: viewUsers,
    settings: viewSettings, payments: viewPayments };
  const active = SUB[r.name] || r.name;
  const tabs = NAV[role()];
  let body = '';
  try { body = V[r.name](r.arg); } catch (e) { console.error(e); body = `<div class="notice bad">${esc(errMsg(e))}</div>`; }
  app.innerHTML = `
  <header class="top"><div class="top-in">
    <a href="#/${tabs[0][0]}"><img class="logo" src="img/logo.png" alt="Taskadoo"></a>
    <nav class="nav">${tabs.map(t => `<a href="#/${t[0]}" class="${t[0] === active ? 'on' : ''}">${esc(t[1])}</a>`).join('')}</nav>
    <div class="who"><span class="chip ink hide-sm">${esc(ROLE_LABEL[role()])}</span>
      <button class="av" data-act="menu" aria-label="Account menu">${esc(initials(S.me.full_name || S.me.email))}</button></div>
  </div>
  ${S.menu ? `<div class="menu"><div style="padding:8px 12px"><div class="b">${esc(S.me.full_name || S.me.email)}</div>
     <div class="tiny muted">${esc(S.me.email)} · ${esc(ROLE_LABEL[role()])}</div></div>
     ${tabs.map(t => `<a class="mi" href="#/${t[0]}">${t[2]} ${esc(t[1])}</a>`).join('')}
     <button class="mi" data-act="logout">↩ Sign out</button></div>` : ''}
  </header>
  <main class="main">${body}</main>
  <nav class="bottom">${tabs.slice(0, 5).map(t => `<a href="#/${t[0]}" class="${t[0] === active ? 'on' : ''}"><span class="i">${t[2]}</span>${esc(t[1])}</a>`).join('')}</nav>`;
  document.body.classList.toggle('has-bottom', true);
  badge();
  after(r);
}
function badge(){ if (CFG.STAGING && !document.querySelector('.stagebadge')) { const b = document.createElement('div'); b.className = 'stagebadge'; b.textContent = 'STAGING'; document.body.appendChild(b); } }

/* things that need the DOM after a render: photo URLs, signature pad, timer */
let tickTimer = null;
function after(r){
  clearInterval(tickTimer);
  const imgs = [...document.querySelectorAll('img[data-path]')];
  const need = imgs.map(i => i.dataset.path).filter(p => !S.urls[p]);
  const fill = () => imgs.forEach(i => { const u = S.urls[i.dataset.path]; if (u) { i.src = u; const a = i.closest('a[data-href]'); if (a) a.href = u; } });
  fill();
  if (need.length) api.signedUrls([...new Set(need)]).then(m => { Object.assign(S.urls, m); fill(); }).catch(e => console.warn(e));
  const pad = document.getElementById('sigpad'); if (pad) sigPad(pad);
  const tm = document.getElementById('timer');
  if (tm) { const t0 = Date.parse(tm.dataset.from); const f = () => { tm.textContent = clock((Date.now() - t0) / 1000); }; f(); tickTimer = setInterval(f, 1000); }
}
const clock = sec => { sec = Math.max(0, Math.floor(sec)); const p = n => String(n).padStart(2, '0'); return p(Math.floor(sec / 3600)) + ':' + p(Math.floor(sec % 3600 / 60)) + ':' + p(sec % 60); };

/* ───────────── Dispatch (dispatcher + admin) ───────────── */
const needsCrew = j => j.status === 'new' || (j.status === 'assigned' && num(j.crew) > 1 && !j.helper_id);
const DFILTERS = [
  ['needs', 'Needs assembler', needsCrew],
  ['waiting', 'Waiting to accept', j => j.status === 'assigned' && !needsCrew(j)],
  ['confirmed', 'Confirmed', j => j.status === 'accepted'],
  ['active', 'In progress', j => ['travelling','arrived','in_progress','finished'].includes(j.status)],
  ['done', 'Completed', j => j.status === 'done'],
  ['cancelled', 'Cancelled', j => j.status === 'cancelled'],
  ['all', 'All', () => true]
];
function viewDispatch(id){
  const t = todayISO();
  const dateOk = j => S.dDate === 'all' || (S.dDate === 'today' ? j.job_date === t : j.job_date >= t);
  const base = S.jobs.filter(dateOk);
  const f = DFILTERS.find(x => x[0] === S.dFilter) || DFILTERS[0];
  const list = base.filter(f[2]).sort((a, b) => (a.job_date + a.slot).localeCompare(b.job_date + b.slot) || a.id - b.id);
  const sel = id ? S.jobs.find(j => String(j.id) === id) : null;
  const today = S.jobs.filter(j => j.job_date === t && j.status !== 'cancelled');
  const kpi = [['Jobs today', today.length], ['Needs assembler', S.jobs.filter(j => j.job_date >= t && needsCrew(j)).length],
    ['In progress', S.jobs.filter(j => ['travelling','arrived','in_progress','finished'].includes(j.status)).length],
    ['Completed today', today.filter(j => j.status === 'done').length]];
  return `
  <div class="row" style="margin-bottom:14px"><div class="grow"><h1>Dispatch</h1><div class="muted">${esc(fmtDate(t))} · ${S.jobs.length} jobs loaded</div></div>
    <select id="d_date" data-in="dDate" style="width:auto"><option value="upcoming" ${S.dDate === 'upcoming' ? 'selected' : ''}>Today &amp; upcoming</option>
      <option value="today" ${S.dDate === 'today' ? 'selected' : ''}>Today only</option><option value="all" ${S.dDate === 'all' ? 'selected' : ''}>All dates</option></select>
    <button class="btn ghost small" data-act="reload">↻ Refresh</button></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">
    ${kpi.map(k => `<div class="card" style="padding:14px"><div class="tiny muted b">${esc(k[0])}</div><div class="big">${k[1]}</div></div>`).join('')}</div>
  <div class="pills" style="margin-bottom:14px">${DFILTERS.map(x => `<button class="pill ${S.dFilter === x[0] ? 'on' : ''}" data-act="dfilter" data-v="${x[0]}">${esc(x[1])}<span class="n">${base.filter(x[2]).length}</span></button>`).join('')}</div>
  <div class="split ${sel ? 'has-sel' : ''}">
    <div class="list">${list.length ? list.map(j => `<a class="li ${sel && sel.id === j.id ? 'on' : ''}" href="#/job/${j.id}">
      <div class="row"><div class="grow"><div class="tiny muted b">${esc(j.code)} · ${esc(j.source === 'enterprise' ? (j.company || 'Enterprise') : j.source === 'staff' ? 'Staff booking' : 'Customer')}</div>
        <div class="b">${esc(itemsSummary(j))}</div>
        <div class="tiny muted">${esc(fmtDate(j.job_date))}, ${esc(j.slot)} · ${esc(j.area || '')} · ${esc(j.customer_name)}</div>
        <div class="tiny" style="margin-top:3px">${num(j.crew) > 1 ? '👥 ' + j.crew + '-person' : '👤 1 assembler'}${j.lead_name ? ' · ' + esc(j.lead_name) + (j.lead_ok ? ' ✓' : '') : ''}${j.helper_name ? ' + ' + esc(j.helper_name) + (j.helper_ok ? ' ✓' : '') : ''}</div></div>
        <div style="text-align:right">${statusChip(j)}<div class="b" style="margin-top:4px">${money(j.total)}</div></div></div></a>`).join('')
      : `<div class="card empty"><div class="ic">🎉</div>Nothing here.</div>`}</div>
    <div class="sticky">${sel ? '<a class="backsm" href="#/dispatch">‹ All jobs</a>' + jobPanel(sel) : `<div class="card empty"><div class="ic">👈</div>Pick a job to see details and assign assemblers.</div>`}</div>
  </div>`;
}
function jobPanel(j){
  const sp = split(j);
  const canAssign = ['new','assigned','accepted'].includes(j.status);
  const asm = S.assemblers;
  const opt = (selId) => `<option value="">— none —</option>` + asm.map(a => `<option value="${esc(a.id)}" ${a.id === selId ? 'selected' : ''}>${esc(a.full_name)}${a.area ? ' · ' + esc(a.area) : ''} (${a.jobs_that_day} that day)</option>`).join('');
  const acc = (ok, name) => name ? (ok ? '<span class="chip green">accepted</span>' : '<span class="chip orange">waiting</span>') : '';
  return `<div class="card">
    <div class="row"><div class="grow"><div class="tiny muted b">${esc(j.code)}</div><h2>${esc(fmtDate(j.job_date))}, ${esc(j.slot)}</h2></div>${statusChip(j)}</div>
    <dl class="kv" style="margin-top:12px">
      <dt>Customer</dt><dd>${esc(j.customer_name)} · <a href="${telHref(j.mobile)}">${esc(j.mobile)}</a>${j.company ? ' · ' + esc(j.company) : ''}</dd>
      <dt>Address</dt><dd><a href="${mapHref(j.address + ' ' + j.area)}" target="_blank" rel="noopener">${esc(j.address)}${j.area ? ', ' + esc(j.area) : ''}</a></dd>
      ${j.notes ? `<dt>Notes</dt><dd>${esc(j.notes)}</dd>` : ''}
      <dt>Crew</dt><dd>${num(j.crew) > 1 ? j.crew + ' assemblers (from the items)' : '1 assembler'}</dd>
    </dl>
  </div>
  <div class="card">${itemsTable(j)}
    <table class="lines" style="margin-top:8px">
      <tr><td>Job fee</td><td class="r">${money(sp.total)}</td></tr>
      <tr><td>Taskadoo ${num(j.commission_pct)}%</td><td class="r">−${money(sp.cut)}</td></tr>
      <tr><td>Lead${sp.two ? ' ' + num(j.lead_pct) + '%' : ''}</td><td class="r money">${money(sp.lead)}</td></tr>
      ${sp.two ? `<tr><td>Extra assembler ${100 - num(j.lead_pct)}%</td><td class="r money">${money(sp.helper)}</td></tr>` : ''}
    </table></div>
  <div class="card">
    <h3 style="margin-bottom:10px">Assemblers</h3>
    ${canAssign ? `
      <label class="f"><span>Lead ${acc(j.lead_ok, j.lead_name)}</span><select id="as_lead">${opt(j.lead_id)}</select></label>
      <label class="f"><span>Extra assembler ${num(j.crew) > 1 ? '(needed)' : '(optional)'} ${acc(j.helper_ok, j.helper_name)}</span><select id="as_helper">${opt(j.helper_id)}</select></label>
      ${!asm.length ? `<div class="notice warn" style="margin-bottom:10px">No active assemblers yet. ${role() === 'admin' ? 'Approve one in <a href="#/users">Users</a>.' : 'Ask Admin to approve assemblers.'}</div>` : ''}
      <div class="row"><button class="btn" data-act="assign" data-id="${j.id}">Save assignment</button>
        ${j.lead_id ? `<button class="btn ghost" data-act="unassign" data-id="${j.id}">Clear</button>` : ''}</div>
      <div class="tiny muted" style="margin-top:8px">Assemblers see the offer in their app and accept it. The customer is confirmed once every slot has accepted.</div>`
    : `<dl class="kv"><dt>Lead</dt><dd>${esc(j.lead_name || '—')}</dd><dt>Extra</dt><dd>${esc(j.helper_name || '—')}</dd></dl>`}
  </div>
  ${photosBlock(j)}
  <div class="card"><h3 style="margin-bottom:8px">History</h3><div class="events">${eventsList(j)}</div>
    ${!['done','cancelled'].includes(j.status) ? `<div style="margin-top:12px"><button class="btn red small" data-act="cancel" data-id="${j.id}">Cancel job</button></div>` : ''}
    ${j.status === 'done' && role() === 'admin' ? `<div style="margin-top:12px">${payBtn(j)}</div>` : ''}
  </div>`;
}
const eventsList = j => (j.events || []).slice().reverse().map(e => `<div><span class="b">${esc(EVENT_LABEL[e.action] || e.action)}</span>${e.note ? ' – ' + esc(e.note) : ''}
  <span class="tiny">· ${esc(e.name || '')} · ${esc(fmtTime(e.at))}</span></div>`).join('') || '<div>No history yet.</div>';
const payBtn = j => j.paid ? `<span class="chip green">Paid ${esc(fmtTime(j.paid_at))}</span> <button class="btn ghost small" data-act="pay" data-id="${j.id}" data-v="0">Undo</button>`
  : `<button class="btn green small" data-act="pay" data-id="${j.id}" data-v="1">Mark customer paid</button>`;

/* ───────────── Assembler app ───────────── */
function viewTasks(){
  const me = S.me.id, t = todayISO();
  const mine = S.jobs.filter(j => j.lead_id === me || j.helper_id === me);
  const myOk = j => (j.lead_id === me ? j.lead_ok : j.helper_ok);
  const offers = mine.filter(j => ['assigned','accepted'].includes(j.status) && !myOk(j));
  const active = mine.filter(j => !['done','cancelled'].includes(j.status) && myOk(j)).sort((a, b) => (a.job_date + a.slot).localeCompare(b.job_date + b.slot));
  const done = mine.filter(j => j.status === 'done').slice(0, 10);
  const todayEarn = mine.filter(j => j.status === 'done' && (j.completed_at || '').slice(0, 10) === t).reduce((s, j) => s + myShare(j), 0);
  const card = j => `<a class="li" href="#/task/${j.id}"><div class="row"><div class="grow">
      <div class="tiny muted b">${esc(j.code)} · ${esc(j.lead_id === me ? 'You are lead' : 'Extra assembler')}</div>
      <div class="b">${esc(itemsSummary(j))}</div><div class="tiny muted">${esc(j.job_date === t ? 'Today' : fmtDate(j.job_date))}, ${esc(j.slot)} · ${esc(j.area || j.address)}</div></div>
      <div style="text-align:right">${statusChip(j)}<div class="money" style="margin-top:4px">${money(myShare(j))}</div></div></div></a>`;
  return `<div class="narrow">
    <div class="card" style="background:var(--ink);color:#fff;border:0">
      <div class="row"><div class="grow"><div class="tiny" style="opacity:.7">Hello</div><div class="b" style="color:#fff;font-size:18px">${esc(S.me.full_name || S.me.email)}</div></div>
        <div style="text-align:right"><div class="tiny" style="opacity:.7">Earned today</div><div style="font-weight:900;font-size:20px;color:#FFB27A">${money(todayEarn)}</div></div></div>
    </div>
    <div class="row" style="margin:16px 0 10px"><h2 class="grow">New offers</h2><button class="btn ghost small" data-act="reload">↻ Refresh</button></div>
    ${offers.length ? offers.map(offerCard).join('<div style="height:10px"></div>') : `<div class="card empty" style="padding:20px">No new offers right now.</div>`}
    <h2 style="margin:22px 0 10px">My jobs</h2>
    ${active.length ? `<div class="list">${active.map(card).join('')}</div>` : `<div class="card empty" style="padding:20px">No upcoming jobs.</div>`}
    ${done.length ? `<h2 style="margin:22px 0 10px">Recently completed</h2><div class="list">${done.map(card).join('')}</div>` : ''}
  </div>`;
}
function offerCard(j){
  const me = S.me.id, lead = j.lead_id === me, sp = split(j);
  const mate = lead ? j.helper_name : j.lead_name;
  return `<div class="offer">
    <div class="row"><span class="chip orange">● NEW OFFER</span><span class="grow"></span><span class="tiny muted b">${esc(j.code)}</span></div>
    <h3 style="margin-top:10px">${esc(itemsSummary(j))}</h3>
    <div class="small muted">${esc(j.area || '')} · ${esc(fmtDate(j.job_date))}, ${esc(j.slot)} · ${esc(mins((j.items || []).reduce((s, i) => s + num(i.minutes) * num(i.qty), 0)))}</div>
    <div class="card" style="background:var(--green-soft);border:0;box-shadow:none;margin-top:10px;padding:14px">
      <div class="tiny b" style="color:var(--green)">${sp.two ? (lead ? 'TEAM JOB · YOU ARE LEAD' : 'TEAM JOB · EXTRA ASSEMBLER') : 'SOLO JOB'}</div>
      <div class="row" style="align-items:baseline"><span class="big" style="color:var(--green)">${money(myShare(j))}</span><span class="small muted">after ${num(j.commission_pct)}% Taskadoo fee</span></div>
      ${sp.two ? `<div class="tiny muted">${mate ? (lead ? 'Extra assembler: ' : 'Lead: ') + '<span class="b">' + esc(mate) + '</span>' : 'Your teammate is being matched'}</div>` : ''}
    </div>
    <div class="grid2" style="margin-top:12px;grid-template-columns:1fr 2fr"><button class="btn ghost" data-act="decline" data-id="${j.id}">Decline</button>
      <button class="btn" data-act="accept" data-id="${j.id}">Accept job</button></div>
  </div>`;
}
function viewTask(id){
  const j = S.jobs.find(x => String(x.id) === id);
  if (!j) return `<div class="narrow card empty">Job not found. <a href="#/tasks">Back</a></div>`;
  const me = S.me.id, lead = j.lead_id === me, myOk = lead ? j.lead_ok : j.helper_ok, t = todayISO();
  if (['assigned','accepted'].includes(j.status) && !myOk) return `<div class="narrow"><p><a href="#/tasks">‹ Tasks</a></p>${offerCard(j)}</div>`;
  const unlocked = !['new','assigned'].includes(j.status) || myOk;
  const mate = lead ? j.helper_name : j.lead_name;
  let step = '';
  const photoBtn = `<label class="btn soft block" style="cursor:pointer">📷 Add photos<input type="file" accept="image/*" capture="environment" multiple hidden data-change="photos" data-id="${j.id}"></label>`;
  if (['new','assigned'].includes(j.status)) {
    step = `<div class="notice">⏳ You've accepted. Waiting for ${num(j.crew) > 1 && !(lead ? j.helper_ok : j.lead_ok) ? 'your teammate to accept' : 'dispatch to confirm the crew'} – the customer is confirmed once every slot is filled.</div>`;
  } else if (j.status === 'accepted') {
    step = lead ? (j.job_date > t ? `<div class="notice">📅 This job is on <b>${esc(fmtDate(j.job_date))}</b>. "Start travelling" opens on the day.</div>`
      : `<div class="notice small" style="margin-bottom:10px">Before you set off: check the address, bring the tools for these items, and message the customer if you'll be late.</div>
         <button class="btn block" data-act="step" data-a="travel" data-id="${j.id}">🚗 Start travelling</button>`) : `<div class="notice">Waiting for ${esc(firstName(j.lead_name))} (lead) to start the job.</div>`;
  } else if (j.status === 'travelling') {
    step = `<div class="notice small" style="margin-bottom:10px">Running more than 10 minutes late? Call the customer – a silent no-show hurts your on-time score.</div>
      ${lead ? `<button class="btn block" data-act="step" data-a="arrive" data-id="${j.id}">📍 I've arrived</button>` : ''}`;
  } else if (j.status === 'arrived') {
    step = `<div class="notice warn small" style="margin-bottom:10px">Check the boxes before you start. Damaged or missing parts found now are the retailer's problem – take a photo.</div>
      ${photoBtn}<div style="height:10px"></div>${lead ? `<button class="btn block green" data-act="step" data-a="start" data-id="${j.id}">▶ Start assembly</button>` : ''}`;
  } else if (j.status === 'in_progress') {
    step = `<div style="text-align:center;margin-bottom:12px"><div class="tiny muted b">ON THE CLOCK</div><div class="timer" id="timer" data-from="${esc(j.started_at)}">00:00:00</div></div>
      ${photoBtn}<div style="height:10px"></div>${lead ? `<button class="btn block" data-act="step" data-a="finish" data-id="${j.id}">■ Finish assembly &amp; take photos</button>` : ''}`;
  } else if (j.status === 'finished') {
    step = lead ? `<h3 style="margin-bottom:6px">1. Photos of the finished work</h3>
      <div class="small muted" style="margin-bottom:10px">${(j.photos || []).length} photo(s) added. At least one is needed.</div>${photoBtn}
      <h3 style="margin:18px 0 6px">2. Hand the phone to the customer</h3>
      <div class="small muted" style="margin-bottom:8px">By signing, the customer confirms the items are assembled and the area was left clean.</div>
      <canvas id="sigpad" class="sig"></canvas>
      <div class="row" style="justify-content:space-between;margin:6px 0 10px"><span class="tiny muted">Sign above with a finger</span><button class="btn ghost small" data-act="sigclear">Clear</button></div>
      <label class="f"><span>Name of person signing</span><input id="sig_name" value="${esc(j.customer_name)}"></label>
      <button class="btn block green" data-act="complete" data-id="${j.id}">✓ Complete job</button>`
      : `${photoBtn}<div class="notice" style="margin-top:10px">${esc(firstName(j.lead_name))} will collect the customer's signature.</div>`;
  } else if (j.status === 'done') {
    const sp = split(j);
    step = `<div style="text-align:center"><div style="font-size:40px">✅</div><h2>Job complete</h2>
      <div class="muted small">Signed by ${esc(j.signed_name)} · ${esc(fmtTime(j.completed_at))}</div></div>
      <table class="lines" style="margin-top:12px"><tr><td>Invoice total</td><td class="r">${money(sp.total)}</td></tr>
      <tr><td>Taskadoo ${num(j.commission_pct)}%</td><td class="r">−${money(sp.cut)}</td></tr>
      ${sp.two ? `<tr><td>${lead ? 'Extra assembler share' : 'Lead share'}</td><td class="r">${money(lead ? sp.helper : sp.lead)}</td></tr>` : ''}
      <tr><td class="b">Your payout</td><td class="r money">${money(myShare(j))}</td></tr></table>`;
  } else if (j.status === 'cancelled') {
    step = `<div class="notice bad">This job was cancelled.</div>`;
  }
  return `<div class="narrow">
    <p><a href="#/tasks">‹ Tasks</a></p>
    <div class="card">
      <div class="row"><div class="grow"><div class="tiny muted b">${esc(j.code)} · ${lead ? 'You are lead' : 'Extra assembler'}</div><h2>${esc(itemsSummary(j))}</h2></div>${statusChip(j)}</div>
      ${stepsBar(j)}
      ${unlocked ? `<dl class="kv" style="margin-top:12px">
        <dt>When</dt><dd>${esc(j.job_date === t ? 'Today' : fmtDate(j.job_date))}, ${esc(j.slot)}</dd>
        <dt>Customer</dt><dd>${esc(j.customer_name)}${j.company ? ' · ' + esc(j.company) : ''}</dd>
        <dt>Address</dt><dd>${esc(j.address)}${j.area ? ', ' + esc(j.area) : ''}</dd>
        ${j.notes ? `<dt>Notes</dt><dd>${esc(j.notes)}</dd>` : ''}
        ${num(j.crew) > 1 || mate ? `<dt>${lead ? 'Extra' : 'Lead'}</dt><dd>${esc(mate || 'Being matched')}</dd>` : ''}
        <dt>Your payout</dt><dd class="money">${money(myShare(j))}</dd>
      </dl>
      ${!['done','cancelled'].includes(j.status) ? `<div class="grid2" style="grid-template-columns:repeat(2,1fr);margin-top:12px">
        <a class="btn ghost" href="${telHref(j.mobile)}">📞 Call</a><a class="btn ghost" href="${mapHref(j.address + ' ' + j.area)}" target="_blank" rel="noopener">🧭 Navigate</a></div>` : ''}` : ''}
    </div>
    <div class="card">${step}</div>
    <div class="card">${itemsTable(j)}</div>
    ${photosBlock(j)}
  </div>`;
}
function viewEarnings(){
  const me = S.me.id, t = todayISO();
  const done = S.jobs.filter(j => (j.lead_id === me || j.helper_id === me) && j.status === 'done');
  const monday = (() => { const d = new Date(t + 'T00:00:00Z'); const k = (d.getUTCDay() + 6) % 7; return addDays(t, -k); })();
  const sum = arr => arr.reduce((s, j) => s + myShare(j), 0);
  const day = j => (j.completed_at ? new Date(Date.parse(j.completed_at) + 8 * 3600e3).toISOString().slice(0, 10) : j.job_date);
  const week = done.filter(j => day(j) >= monday), month = done.filter(j => day(j).slice(0, 7) === t.slice(0, 7));
  return `<div class="narrow">
    <h1 style="margin-bottom:14px">Earnings</h1>
    <div class="grid2" style="grid-template-columns:repeat(3,1fr)">
      ${[['This week', sum(week)], ['This month', sum(month)], ['All time', sum(done)]].map(k => `<div class="card" style="padding:14px"><div class="tiny muted b">${k[0]}</div><div class="money" style="font-size:20px">${money(k[1])}</div></div>`).join('')}
    </div>
    <div class="card" style="margin-top:14px"><h3 style="margin-bottom:8px">How a job pays out</h3>
      <div class="small">Customer's job fee − Taskadoo commission (${num(S.settings.commission)}%) = crew pool. On team jobs the lead gets ${num(S.settings.lead_pct)}% of the pool because they own sign-off, photos and issue reporting; the extra assembler gets ${100 - num(S.settings.lead_pct)}%.</div>
      <div class="tiny muted" style="margin-top:6px">Payouts are arranged by Taskadoo. Weekly automatic payouts come in the next phase.</div></div>
    <h3 style="margin:18px 0 10px">Completed jobs</h3>
    ${done.length ? `<div class="list">${done.map(j => `<a class="li" href="#/task/${j.id}"><div class="row"><div class="grow"><div class="b">${esc(itemsSummary(j))}</div>
      <div class="tiny muted">${esc(j.code)} · ${esc(fmtDate(day(j)))} · ${j.lead_id === me ? 'Lead' : 'Extra'}</div></div>
      <div style="text-align:right"><div class="money">${money(myShare(j))}</div><div class="tiny muted">${j.paid ? 'Customer paid' : 'Awaiting customer payment'}</div></div></div></a>`).join('')}</div>`
      : `<div class="card empty" style="padding:20px">No completed jobs yet.</div>`}
  </div>`;
}

/* ───────────── Admin: payments ───────────── */
function viewPayments(){
  const done = S.jobs.filter(j => j.status === 'done').sort((a, b) => (a.paid - b.paid) || String(b.completed_at).localeCompare(String(a.completed_at)));
  const tot = done.reduce((a, j) => { const s = split(j); a.g += s.total; a.c += s.cut; a.p += s.pool; if (!j.paid) a.u += s.total; return a; }, { g: 0, c: 0, p: 0, u: 0 });
  return `<div class="row" style="margin-bottom:14px"><h1 class="grow">Payments</h1><button class="btn ghost small" data-act="reload">↻ Refresh</button></div>
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px">
      ${[['Completed jobs (gross)', tot.g], ['Taskadoo commission', tot.c], ['Owed to assemblers', tot.p], ['Not yet paid by customers', tot.u]].map(k =>
        `<div class="card" style="padding:14px"><div class="tiny muted b">${k[0]}</div><div class="big" style="font-size:22px">${money(k[1])}</div></div>`).join('')}</div>
    <div class="card scroll">${done.length ? `<table class="tbl"><tr><th>Job</th><th>Customer</th><th>Completed</th><th>Assemblers</th><th style="text-align:right">Total</th><th>Customer payment</th></tr>
      ${done.map(j => { const s = split(j); return `<tr><td><a href="#/job/${j.id}" class="b">${esc(j.code)}</a></td><td>${esc(j.customer_name)}${j.company ? '<div class="tiny muted">' + esc(j.company) + '</div>' : ''}</td>
        <td>${esc(fmtTime(j.completed_at))}</td><td class="small">${esc(j.lead_name)} ${money(s.lead)}${j.helper_name ? '<br>' + esc(j.helper_name) + ' ' + money(s.helper) : ''}</td>
        <td style="text-align:right" class="b">${money(s.total)}</td><td>${payBtn(j)}</td></tr>`; }).join('')}</table>`
      : `<div class="empty">No completed jobs yet.</div>`}</div>`;
}

/* ───────────── Admin: catalogue ───────────── */

  const catOpts = sel => cats().map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const row = (c, k) => `<tr data-row="${k}">
    <td><input data-f="emoji" value="${esc(c.emoji)}" style="width:48px;text-align:center"></td>
    <td><input data-f="sku" value="${esc(c.sku)}" style="min-width:110px"></td>
    <td><input data-f="name" value="${esc(c.name)}" style="min-width:200px"></td>
    <td><input data-f="brand" value="${esc(c.brand)}" style="min-width:100px"></td>
    <td><select data-f="cat">${catOpts(c.cat)}</select></td>
    <td><input data-f="fee" type="number" min="0" step="10" value="${esc(c.fee)}" style="width:90px"></td>
    <td><input data-f="crew" type="number" min="1" max="4" value="${esc(c.crew)}" style="width:60px"></td>
    <td><input data-f="minutes" type="number" min="5" step="5" value="${esc(c.minutes)}" style="width:75px"></td>

  return `<div class="row" style="margin-bottom:6px"><h1 class="grow">Catalogue</h1></div>
    <p class="muted" style="margin-top:0">Every item has a fixed assembly fee. Crew = how many assemblers the item needs (the job takes the highest). Untick "On" to hide an item from booking.</p>
    <div class="card scroll"><table class="tbl"><tr><th></th><th>SKU</th><th>Item</th><th>Brand</th><th>Category</th><th>Fee</th><th>Crew</th><th>Minutes</th><th>On</th><th></th></tr>
      ${row({ emoji: '📦', sku: '', name: '', brand: '', cat: (cats()[0] || {}).id, fee: '', crew: 1, minutes: 60, active: true }, 'new')}
      ${items.map((c, k) => row(c, k)).join('')}</table></div>`;
}

        <td class="small">${esc(p.email)}<br>${esc(p.mobile)}</td>

          ${p.requested_role && p.role === 'customer' ? ` <button class="btn green small" data-act="approve" data-id="${esc(p.id)}">Approve as ${esc(ROLE_LABEL[p.requested_role])}</button>` : ''}`}</td></tr>`; }).join('')}</table>`

/* ───────────── Photos & signature ───────────── */
function compress(file, max = 1600){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read the photo.')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a photo we can read.')); };
    img.src = url;
  });
}
const rid = () => Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
let sig = { drawn: false };
function sigPad(c){
  const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#262261';
  sig = { drawn: false, c }; let down = false, last = null;
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { down = true; last = pt(e); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (!down) return; const p = pt(e); x.beginPath(); x.moveTo(last[0], last[1]); x.lineTo(p[0], p[1]); x.stroke(); last = p; sig.drawn = true; };
  c.onpointerup = c.onpointercancel = () => { down = false; };
}

/* ───────────── Actions ───────────── */
async function reloadJob(id){ const j = await api.job(id); const k = S.jobs.findIndex(x => x.id === id); if (j) { if (k >= 0) S.jobs[k] = j; else S.jobs.unshift(j); } else if (k >= 0) S.jobs.splice(k, 1); }
const ACT = {
  menu(){ S.menu = !S.menu; render(); },
  async logout(){ S.menu = false; await api.signOut(); S.session = null; S.me = null; S.jobs = []; render(); },
  authtab(b, e){ e.preventDefault(); S.authTab = b.dataset.tab; render(); },
  want(b){ const keep = { a_name: val('a_name'), a_mobile: val('a_mobile'), a_email: val('a_email'), a_pw: (document.getElementById('a_pw') || {}).value || '' };
    S.want = b.dataset.v; render(); Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el) el.value = v; }); },
  async signin(b){ await busy(b, async () => {
    const email = val('a_email'), pw = (document.getElementById('a_pw') || {}).value || '';
    if (!email || !pw) throw new Error('Enter your email and password.');
    await api.signIn(email, pw);
  }); },
  async signup(b){ await busy(b, async () => {
    const email = val('a_email'), pw = (document.getElementById('a_pw') || {}).value || '', name = val('a_name'), mobile = val('a_mobile');
    if (name.length < 2) throw new Error('Please enter your full name.');
    if (mobile.replace(/\D/g, '').length < 10) throw new Error('Please enter a valid mobile number.');
    if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Please enter a valid email.');
    if (pw.length < 8) throw new Error('Password must be at least 8 characters.');
    const r = await api.signUp(email, pw, { full_name: name, mobile, company: val('a_company'), requested_role: S.want });
    if (!r || !r.session) { S.authTab = 'in'; render(); toast('Account created. Check your email to confirm it, then sign in.'); }
  }); },
  async forgot(b){ await busy(b, async () => { const email = val('a_email'); if (!email) throw new Error('Enter your email.');
    await api.resetPassword(email); toast('If that email has an account, a reset link is on its way.'); }); },
  async newpw(b){ await busy(b, async () => { const pw = (document.getElementById('a_pw') || {}).value || '';
    if (pw.length < 8) throw new Error('Password must be at least 8 characters.');
    await api.setPassword(pw); S.recovery = false; history.replaceState(null, '', '#/'); toast('Password saved.'); await afterLogin(); }); },
  cat(b){ S.cat = b.dataset.v; render(); },
  brand(b){ S.brand = b.dataset.v; render(); },
  qty(b){ const id = b.dataset.id, n = Math.max(0, Math.min(50, (S.cart[id] || 0) + Number(b.dataset.d))); if (n) S.cart[id] = n; else delete S.cart[id]; saveCart(); render(); },
  slot(b){ const keep = {}; ['c_name','c_mobile','c_address','c_area','c_notes','c_company'].forEach(k => keep[k] = val(k));
    S.slot = b.dataset.v; render(); Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el && v) el.value = v; }); },
  async confirm(b){ await busy(b, async () => {
    if (!S.slot) throw new Error('Please choose a time slot.');
    const p = { items: cartLines().map(l => ({ id: l.it.id, qty: l.n })), date: val('c_date'), slot: S.slot, name: val('c_name'), mobile: val('c_mobile'),
      address: val('c_address'), area: val('c_area'), notes: val('c_notes'), company: val('c_company') };
    if (!p.area) throw new Error('Please choose the city / area.');
    const r = await api.rpc('create_booking', { p });
    S.cart = {}; saveCart(); S.slot = ''; S.lastBooked = r.id;
    await reloadJob(r.id); go('book', 'done');
  }); },
  async cancel(b){ if (!confirm('Cancel this booking?')) return;
    await busy(b, async () => { const id = Number(b.dataset.id); await api.rpc('cancel_booking', { p_job: id, p_reason: '' }); await reloadJob(id); toast('Cancelled.'); render(); }); },
  async reload(b){ await busy(b, async () => { await loadJobs(); if (isStaff() && route().name === 'job') await loadAssemblers(); render(); toast('Updated'); }); },
  dfilter(b){ S.dFilter = b.dataset.v; render(); },
  async assign(b){ await busy(b, async () => { const id = Number(b.dataset.id);
    await api.rpc('assign_job', { p_job: id, p_lead: val('as_lead') || null, p_helper: val('as_helper') || null });
    await reloadJob(id); toast('Assignment saved – offers sent.'); render(); }); },
  async unassign(b){ await busy(b, async () => { const id = Number(b.dataset.id);
    await api.rpc('assign_job', { p_job: id, p_lead: null, p_helper: null }); await reloadJob(id); render(); }); },
  async pay(b){ await busy(b, async () => { const id = Number(b.dataset.id);
    await api.rpc('mark_paid', { p_job: id, p_paid: b.dataset.v === '1' }); await reloadJob(id); render(); }); },
  async accept(b){ await busy(b, async () => { const id = Number(b.dataset.id); await api.rpc('job_action', { p_job: id, p_action: 'accept', p: {} });
    await reloadJob(id); toast('Job accepted'); go('task', id); render(); }); },
  async decline(b){ if (!confirm('Decline this job?')) return;
    await busy(b, async () => { const id = Number(b.dataset.id); await api.rpc('job_action', { p_job: id, p_action: 'decline', p: {} });
      await reloadJob(id); go('tasks'); render(); }); },
  async step(b){ await busy(b, async () => { const id = Number(b.dataset.id); await api.rpc('job_action', { p_job: id, p_action: b.dataset.a, p: {} });
    await reloadJob(id); render(); window.scrollTo(0, 0); }); },
  sigclear(){ const c = document.getElementById('sigpad'); if (c) sigPad(c); },
  async complete(b){ await busy(b, async () => {
    const id = Number(b.dataset.id), name = val('sig_name');
    if (!sig.drawn || !sig.c) throw new Error('Please ask the customer to sign first.');
    if (name.length < 2) throw new Error('Enter the name of the person signing.');
    const blob = await new Promise(r => sig.c.toBlob(r, 'image/png'));
    const path = id + '/sig_' + rid() + '.png';
    await api.upload(path, blob, 'image/png');
    await api.rpc('job_action', { p_job: id, p_action: 'complete', p: { signature: path, signed_name: name } });
    await reloadJob(id); toast('Job complete 🎉'); render(); window.scrollTo(0, 0);
  }); },
  async saveprofile(b){ await busy(b, async () => {
    const f = { full_name: val('p_name'), mobile: val('p_mobile'), area: val('p_area') };
    if (document.getElementById('p_company')) f.company = val('p_company');
    S.me = await api.updateProfile(S.me.id, f) || S.me; toast('Saved'); render(); }); },
  async reloadusers(b){ await busy(b, async () => { await loadProfiles(); render(); }); },
  ufilter(b){ S.uFilter = b.dataset.v; render(); },
  async saveuser(b){ await busy(b, async () => {
    const tr = b.closest('tr'), f = { role: tr.querySelector('[data-f=role]').value, active: tr.querySelector('[data-f=active]').checked };
    const p = S.profiles.find(x => x.id === b.dataset.id); if (p && f.role !== 'customer' && p.requested_role === f.role) f.requested_role = '';
    await api.updateProfile(b.dataset.id, f); await loadProfiles(); toast('Saved'); render(); }); },
  async approve(b){ await busy(b, async () => {
    const p = S.profiles.find(x => x.id === b.dataset.id); if (!p) return;
    await api.updateProfile(p.id, { role: p.requested_role, requested_role: '' }); await loadProfiles(); toast(p.full_name + ' approved'); render(); }); },
  async saveitem(b){ await busy(b, async () => {
    const tr = b.closest('tr'), g = k => tr.querySelector('[data-f=' + k + ']');
    const it = { sku: g('sku').value.trim(), name: g('name').value.trim(), brand: g('brand').value.trim(), cat: g('cat').value,
      fee: num(g('fee').value), crew: Math.max(1, Math.min(4, Math.round(num(g('crew').value)) || 1)),
      minutes: Math.max(5, Math.round(num(g('minutes').value)) || 60), emoji: g('emoji').value.trim() || '📦', active: g('active').checked };
    if (!it.sku || !it.name || !it.brand) throw new Error('SKU, item name and brand are needed.');
    if (b.dataset.id) it.id = Number(b.dataset.id);
    await api.saveItem(it); S.catalog = await api.catalog(); toast('Saved'); render(); }); },
  async savesettings(b){ await busy(b, async () => {
    const lines = id => val(id).split('\n').map(x => x.trim()).filter(Boolean);
    const comm = num(val('s_comm')), lead = num(val('s_lead'));
    if (comm < 0 || comm > 90) throw new Error('Commission must be between 0 and 90%.');
    if (lead < 0 || lead > 100) throw new Error('Lead share must be between 0 and 100%.');
    const categories = lines('s_cats').map(l => { const [id, ...n] = l.split('='); return { id: id.trim().toLowerCase().replace(/\s+/g, '-'), name: (n.join('=') || id).trim() }; });
    const v = Object.assign({}, S.settings, { commission: comm, lead_pct: lead, currency: val('s_cur'), slots: lines('s_slots'), areas: lines('s_areas'),
      categories, payment_note: val('s_pay') });
    if (!v.slots.length) throw new Error('Add at least one time slot.');
    await api.saveSettings(v); S.settings = v; toast('Settings saved'); render(); }); }
};
const CHANGE = {
  async photos(el){
    const id = Number(el.dataset.id), files = [...el.files]; if (!files.length) return;
    const label = el.closest('label'); if (label) { label.style.opacity = .6; label.firstChild.textContent = 'Uploading… '; }
    try {
      for (const f of files) {
        const blob = await compress(f), path = id + '/' + rid() + '.jpg';
        await api.upload(path, blob, 'image/jpeg');
        await api.rpc('job_action', { p_job: id, p_action: 'photo', p: { path } });
      }
      await reloadJob(id); toast(files.length > 1 ? files.length + ' photos added' : 'Photo added');
    } catch (e) { console.warn(e); toast(errMsg(e), true); }
    render();
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); } return; }
  const f = ACT[b.dataset.act]; if (f) { if (b.tagName === 'A') e.preventDefault(); f(b, e); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  S[k] = e.target.value;
  if (k === 'search' || k === 'uSearch') { const pos = e.target.selectionStart; render(); const el = document.querySelector('[data-in="' + k + '"]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }
  if (k === 'dDate') render();
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.change; if (k && CHANGE[k]) CHANGE[k](e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.auth') && e.target.tagName === 'INPUT') { const b = document.querySelector('.auth .btn[data-act]'); if (b) b.click(); } });
window.addEventListener('hashchange', async () => {
  S.menu = false;
  const r = route();
  if (S.me && isStaff() && r.name === 'job') { const j = S.jobs.find(x => String(x.id) === r.arg); try { await loadAssemblers(j ? j.job_date : null); } catch (e) { console.warn(e); } }
  render(); if (!['job'].includes(r.name)) window.scrollTo(0, 0);
});
/* light auto-refresh for lists (skipped while typing) */
setInterval(async () => {
  if (!S.me || document.hidden) return;
  const r = route().name;
  if (!['tasks','bookings','dispatch','booking'].includes(r)) return;
  const a = document.activeElement; if (a && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName)) return;
  try { await loadJobs(); if (route().name === r) render(); } catch (e) { console.warn(e); }
}, 45000);
boot();
