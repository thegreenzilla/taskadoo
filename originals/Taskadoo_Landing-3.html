  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

d.pick }}\" style=\"{{ d.style }}\">\n<span style=\"{{ d.radio }}\"><\u002Fspan>\n<span style=\"flex:1;text-align:left\">\n<span style=\"display:block;font-weight:700;font-size:14.5px;color:#262261\">{{ d.title }}<\u002Fspan>\n<span style=\"display:block;font-weight:500;font-size:13px;line-height:1.45;color:#6B6577;margin-top:2px\">{{ d.body }}<\u002Fspan>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#FAF8F3;border:1px solid #EAE5DC;border-radius:13px;padding:13px 15px;font-size:12.5px;line-height:1.65;color:#6B6577;font-weight:500\">\nBy submitting you agree to Taskadoo's <a href=\"#\" style=\"color:#0E77BA\">Enterprise Terms<\u002Fa>. All assemblers are recruited, vetted and insured by Taskadoo — enterprise accounts book from the shared pool rather than onboarding their own.\n<\u002Fdiv>\n\n<button sc-camel-on-click=\"{{ submitBiz }}\" style=\"border:none;border-radius:14px;background:#0E77BA;color:#fff;font-weight:700;font-size:16.5px;padding:16px;cursor:pointer;box-shadow:0 12px 26px rgba(14,119,186,.3)\" style-hover=\"background:#0B5E92\">Submit enterprise application<\u002Fbutton>\n<div style=\"text-align:center;font-size:14px;font-weight:600;color:#8E8896\">Already registered? <a href=\"#\" style=\"color:#0E77BA\">Sign in to your portal<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fff;border-radius:24px;padding:clamp(26px,3.5vw,38px);box-shadow:0 30px 70px rgba(0,0,0,.3);color:#262261;animation:tdrise .4s ease both\">\n<div style=\"width:64px;height:64px;border-radius:20px;background:#DFF1E9;display:flex;align-items:center;justify-content:center;margin-bottom:20px\"><svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15875A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4 10-11\"><\u002Fpath><\u002Fsvg><\u002Fdiv r:false, features:['Dedicated pro or crew','Scheduled around you','Volume pricing','Single point of contact'], cta:'Get a custom quote', kind:'light'}\n      ],\n      faqs: [\n        {q:'How much does assembly cost?', a:'Each item has a flat, upfront fee — from \\u20B1450. You\\u2019ll see the exact price before you book, including tools and box cleanup. Bundling multiple items lowers the per-item cost.'},\n        {q:'Can I just upload my receipt?', a:'Yes — that\\u2019s the fastest way. Snap your IKEA, NITORI, Mandaue Foam or MUJI receipt and we read every line, match it to our assembly database and send a full quotation. Anything we can\\u2019t match is priced by a human within 30 minutes.'},\n        {q:'How soon can someone come?', a:'Most areas have assemblers available the same day. Enter your city and you\\u2019ll see the earliest windows for pros near you.'},\n        {q:'Are the assemblers vetted?', a:'Yes. Every assembler passes identity and NBI checks before joining, and is rated by customers on every job. Each booking is insured up to \\u20B11,000,000.'},\n        {q:'What if nobody\\u2019s home when they arrive?', a:'Your assembler waits 15 minutes and logs proof of arrival. If the visit still can\\u2019t go ahead, a capped failed-visit fee applies — and your first one is always waived, or credited if you rebook within 7 days.'},\n        {q:'Do I need to provide tools?', a:'No. Your assembler brings everything needed. Just have the flat-packed boxes and a bit of space ready.'}\n      ],\n      footCols2: [\n        {title:'Company', links:['About us','Careers','Press','Become an assembler']},\n        {title:'Services', links:['Furniture assembly','TV mounting','Receipt quotation','Taskadoo for Business']},\n        {title:'Support', links:['Help center','Happiness Guarantee','Trust & safety','Contact']}\n      ],\n      bizFeatures: [\n        'Book multiple assemblers across multiple sites in one submission',\n        'Upload a CSV or connect your k, c) => el(this.icons[k].replace('STK', c));\n    const tone = bg => bg === '#DFF1E9' ? '#15875A' : (bg === '#FAE6D5' || bg === '#FBEEDD') ? '#C44F12' : bg === '#E2ECFB' ? '#2C6FE0' : '#0E77BA';\n\n    const inputStyle = 'width:100%;border:1px solid #E0DBD1;background:#FAF8F3;border-radius:12px;padding:13px 14px;font-weight:600;font-size:15px;color:#262261;font-family:inherit';\n    const labelStyle = 'font-size:11.5px;font-weight:700;color:#A39EAC;letter-spacing:.05em;text-transform:uppercase;padding-left:2px';\n\n    const modes = [\n      {id:'managed', title:'Fully managed', body:'Taskadoo dispatches everything. No console needed.'},\n      {id:'co', title:'Co-managed', body:'Assign from an allocated pool; unfilled jobs escalate to us.'},\n      {id:'self', title:'Self-dispatch', body:'Your own dispatchers run the shared pool. Subject to tier.'}\n    ];\n\n    const peso = n => this.peso(n);\n    const byId = id => d.catalog.find(p => p.id === id);\n    const cartIds = Object.keys(s.cart).map(Number);\n    const cartTotal = cartIds.reduce((a, id) => a + byId(id).fee * s.cart[id], 0);\n    const cartCount = cartIds.reduce((a, id) => a + s.cart[id], 0);\n    const meta = d.catMeta[s.cat] || d.catMeta.bedroom;\n    const inCat = d.catalog.filter(p => p.cat === s.cat);\n    const catBrands = ['All'].concat(Array.from(new Set(inCat.map(p => p.brand))));\n    const visible = inCat.filter(p => s.catBrand === 'All' || p.brand === s.catBrand);\n    const scanBase = 1200 + 900;\n    const scanTotal = scanBase + (s.sofaConfirmed ? 1100 : 0);\n\n    return {\n      isHome: s.view === 'home', isBusiness: s.view === 'business',\n      isCatalog: s.view === 'catalog', isUpload: s.view === 'upload', isCart: s.view === 'cart',\n\n      goUpload: () => { this.setState({ view: 'upload', menuOpen: false, scan: 'idle' }); window.scrollTo(0, 0); },\n      goCart: () => { this.setState({ view: 'cart' }); window.scrollTo(0, 0); },\n      backToCatalog: () => this.openCat(s.cat),\n      openBedroom: () => this.openCat('bedroom'),\n      startScan: () => this.runScan(),\n      resetScan: () => this.setState({ scan: 'idle', scanPct: 0, sofaConfirmed: false }),\n      upIdle: s.scan === 'idle', upReading: s.scan === 'reading', upDone: s.scan === 'done',\n      scanPct: s.scanPct + '%',\n      upHints: d.upHints, included: d.included,\n\n      catTitle: meta.title, catBlurb: meta.blurb,\n      catTabs: [\n        {k:'bedroom', label:'Bedroom'}, {k:'storage', label:'Storage'}, {k:'office', label:'Office'},\n        {k:'living', label:'Living room'}, {k:'tv', label:'TV & mounting'}, {k:'dining', label:'Dining'}\n      ].map(t => ({ label: t.label, style: this.chip(s.cat === t.k), pick: () => this.openCat(t.k) })),\n      brandTabs: catBrands.map(b => ({\n        label: b === 'All' ? 'All stores' : b,\n        style: this.chip(s.catBrand === b) + ';font-size:12.5px;padding:7px 13px',\n        pick: () => this.setState({ catBrand: b })\n      })),\n      resultCount: visible.length + (visible.length === 1 ? ' item' : ' items'),\n      items: visible.map(p => ({\n        ...p, feeStr: peso(p.fee), qty: s.cart[p.id] || 0,\n        inCart: !!s.cart[p.id], notInCart: !s.cart[p.id],\n        crewLabel: p.crew > 1 ? '2 assemblers' : '1 assembler',\n        crewBg: p.crew > 1 ? '#FBEEDD' : '#E2F0FA', crewFg: p.crew > 1 ? '#B67A12' : '#0E77BA',\n        add: () => this.addItem(p.id), dec: () => this.decItem(p.id)\n      })),\n\n      cartLines: cartIds.map(id => {\n        const p = byId(id);\n        return { ...p, qty: s.cart[id], lineStr: peso(p.fee * s.cart[id]),\n          crewLabel: p.crew > 1 ? '2 assemblers' : '1 assembler',\n          add: () => this.addItem(id), dec: () => this.decItem(id) };\n      }),\n      cartEmpty: cartIds.length === 0,\n      needsCrew: cartIds.some(id => byId(id).crew > 1),\n      cartTotalStr: peso(cartTotal),\n      cartCountLabel: cartCount + (cartCount === 1 ? ' item' : ' items'),\n      crewNote: cartIds.some(id => byId(id).crew > 1) ? ' · 2-person crew' : '',\n      showCartBar: cartCount > 0 && (s.view === 'catalog' || s.view === 'upload'),\n      cartCols: s.w >= 900 ? '1fr 340px' : '1fr',\n      slots: ['Today 2:00 PM','Today 5:00 PM','Tomorrow 9:00 AM','Sat 10:00 AM'].map((l, i) => ({\n        label: l, pick: () => this.setState({ slot: i }),\n        style: 'padding:11px 8px;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;border:1px solid ' +\n          (s.slot === i ? '#0E77BA' : '#E0DBD1') + ';background:' + (s.slot === i ? '#EAF4FB' : '#FAF8F3') + ';color:' + (s.slot === i ? '#0E77BA' : '#55505F')\n      })),\n      confirmBooking: () => {\n        if (cartCount === 0) { this.toast('Add an item or upload a receipt first'); return; }\n        this.toast('Booked — a vetted assembler is being matched now');\n      },\n\n      scanTotalStr: peso(scanTotal),\n      scanLines: [\n        {tag:'MATCHED · IKEA SKU FEED', accent:'#15875A', name:'PAX Wardrobe (2-door)', raw:'IK-PAX-2D  ×1', priceStr: peso(1200), note:'Exact SKU match. 2-person job, about 3 hours.', needsConfirm:false},\n        {tag:'MATCHED · IKEA SKU FEED', accent:'#15875A', name:'BILLY Bookcase ×2', raw:'IK-BIL-80  ×2', priceStr: peso(900), note:'Exact SKU match. One assembler, about 2 hours for the pair.', needsConfirm:false},\n        {tag: s.sofaConfirmed ? 'CONFIRMED BY YOU' : 'FUZZY MATCH 78% · CONFIRM', accent: s.sofaConfirmed ? '#15875A' : '#B67A12',\n         name:'Mandaue Foam Sofa Set (3+1)', raw:'\"SOFA MF 3ST BLK\"', priceStr: peso(1100),\n         note: s.sofaConfirmed ? 'Added to the quote at the standard sofa-set fee.' : 'Name match only — Mandaue Foam doesn\\u2019t share SKUs with us. Confirm this is the right item and we\\u2019ll price it.',\n         needsConfirm: true, confirmLabel: s.sofaConfirmed ? '✓ Confirmed' : 'Yes, that\\u2019s it',\n         confirmStyle: 'margin-top:9px;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:11px;white-space:nowrap;background:' +\n           (s.sofaConfirmed ? '#DFF1E9' : '#0E77BA') + ';color:' + (s.sofaConfirmed ? '#15875A' : '#fff'),\n         confirm: () => this.setState({ sofaConfirmed: true })},\n        {tag:'UNMATCHED · PRICED BY A HUMAN', accent:'#C0392B', name:'Sent to our pricing desk', raw:'\"NT-RACK-5T STEEL\"', priceStr:'—', note:'New to us. Someone prices it within 30 minutes and it becomes a permanent SKU.', needsConfirm:false},\n        {tag:'IGNORED · NOT AN ASSEMBLY ITEM', accent:'#BDB8B0', name:'Delivery charge', raw:'\"DELIVERY FEE\"', priceStr:'—', note:'Excluded from the quote.', needsConfirm:false}\n      ],\n      addScanToCart: () => {\n        this.setState(p => {\n          const c = { ...p.cart };\n          c[1] = (c[1] || 0) + 1;\n          c[13] = (c[13] || 0) + 2;\n          if (p.sofaConfirmed) c[23] = (c[23] || 0) + 1;\n          return { cart: c, view: 'cart' };\n        });\n        window.scrollTo(0, 0);\n      },\n\n      isDesktop, isMobile: !isDesktop, menuOpen: s.menuOpen && !isDesktop,\n      goHome: () => { this.setState({ view: 'home', menuOpen: false, submitted: false, scan: 'idle' }); window.scrollTo(0, 0); },\n      goBusiness: () => { this.setState({ view: 'business', menuOpen: false }); window.scrollTo(0, 0); },\n      toggleMenu: () => this.setState(p => ({ menuOpen: !p.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      bizBtn: 'border:1px solid #262261;background:transparent;color:#262261;font-weight:700;font-size:14.5px;padding:9px 17px;border-radius:999px;cursor:pointer;white-space:nowrap',\n\n      heroCols: isDesktop ? '1.1fr .9fr' : '1fr',\n      whyCols: isDesktop ? '1fr .85fr' : '1fr',\n      bizCols: isDesktop ? '1fr .95fr' : '1fr',\n      reviewCols: s.w >= 1000 ? 3 : s.w >= 640 ? 2 : 1,\n      footCols: isDesktop ? '1.4fr 1fr 1fr 1fr' : s.w >= 560 ? '1fr 1fr' : '1fr',\n\n      itemOptions: d.itemOptions, bookItem: s.bookItem, bookArea: s.bookArea,\n      onItemChange: e => this.setState({ bookItem: e.target.value, quoteShown: false }),\n      onAreaInput: e => this.setState({ bookArea: e.target.value }),\n      onQuote: () => this.openCat(s.bookItem),\n      heroAvatars: [\n        {t:'MR', bg:'#E2F0FA', fg:'#0E77BA'}, {t:'SL', bg:'#DFF1E9', fg:'#15875A'},\n        {t:'DA', bg:'#FAE6D5', fg:'#C44F12'}, {t:'JT', bg:'#E2ECFB', fg:'#2C6FE0'}\n      ].map((a, i) => ({ ...a, ml: i === 0 ? '0' : '-12px' })),\n      brands: d.brands, trustStats: d.trustStats,\n      steps: d.steps.map(x => ({ ...x, icon: stk(x.icon, tone(x.iconBg)) })),\n      categories: d.categories.map(c => {\n        const list = d.catalog.filter(p => p.cat === c.key);\n        return { ...c, icon: stk(c.icon, tone(c.bg)), count: list.length,\n          from: peso(Math.min.apply(null, list.map(p => p.fee))), open: () => this.openCat(c.key) };\n      }),\n      whyPoints: d.whyPoints.map(w => ({ ...w, icon: stk(w.icon, tone(w.bg)) })),\n      pros: d.pros, reviews: d.reviews,\n      tiers: d.tiers.map(t => t.kind === 'dark'\n        ? { ...t, cardBg:'linear-gradient(155deg,#0E77BA,#262261)', ink:'#ffffff', muted:'#AFD0EC', check:'#6FB2DD', border:'none', shadow:'0 26px 60px rgba(14,119,186,.32)', btnBg:'#ffffff', btnFg:'#0E77BA', btnBorder:'none' }\n        : { ...t, cardBg:'#FAF8F3', ink:'#262261', muted:'#8E8896', check:'#15875A', border:'1px solid #EAE5DC', shadow:'none', btnBg:'#262261', btnFg:'#ffffff', btnBorder:'none' }),\n      faqs: d.faqs.map((f, i) => ({\n        ...f, open: s.openFaq === i, rot: s.openFaq === i ? '180deg' : '0deg',\n        iconBg: s.openFaq === i ? '#0E77BA' : '#F1EFE8', iconStroke: s.openFaq === i ? '#ffffff' : '#8E8896',\n        onToggle: () => this.setState(p => ({ openFaq: p.openFaq === i ? -1 : i }))\n      })),\n      footCols2: d.footCols2,\n\n      bizFeatures: d.bizFeatures, bizStats: d.bizStats, nextSteps: d.nextSteps,\n      levels: d.levels.map(l => l.kind === 'dark'\n        ? { ...l, bg:'linear-gradient(155deg,#0E77BA,#262261)', ink:'#ffffff', body:'#CFE3F4', muted:'#7FB6E0', check:'#7FD8A8', border:'none', shadow:'0 26px 60px rgba(14,119,186,.3)' }\n        : { ...l, bg:'#fff', ink:'#262261', body:'#55505F', muted:'#A39EAC', check:'#15875A', border:'1px solid #EFEBE3', shadow:'none' }),\n\n      formOpen: !s.submitted, submitted: s.submitted,\n      inputStyle, labelStyle,\n      company: s.company, email: s.email,\n      onCompany: e => this.setState({ company: e.target.value }),\n      onEmail: e => this.setState({ email: e.target.value }),\n      brandChips: d.brands.map(b => ({\n        name: b, style: this.chip(s.brands.includes(b)),\n        toggle: () => this.setState(p => ({ brands: p.brands.includes(b) ? p.brands.filter(x => x !== b) : p.brands.concat(b) }))\n      })),\n      areaChips: ['Metro Manila', 'Cebu', 'Davao', 'Bangkok'].map(a => ({\n        name: a, style: this.chip(s.areas.includes(a)),\n        toggle: () => this.setState(p => ({ areas: p.areas.includes(a) ? p.areas.filter(x => x !== a) : p.areas.concat(a) }))\n      })),\n      dispatchModes: modes.map(mo => ({\n        ...mo, pick: () => this.setState({ mode: mo.id }),\n        style: 'display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border-radius:13px;cursor:pointer;font-family:inherit;text-align:left;border:1px solid ' +\n          (s.mode === mo.id ? '#0E77BA' : '#E0DBD1') + ';background:' + (s.mode === mo.id ? '#EAF4FB' : '#FAF8F3'),\n        radio: 'width:18px;height:18px;flex:none;border-radius:50%;margin-top:2px;display:block;border:' +\n          (s.mode === mo.id ? '5px solid #0E77BA' : '2px solid #C8C2B6') + ';background:#fff'\n      })),\n      submitBiz: () => {\n        if (!s.company.trim()) { this.toast('Please enter your company name'); return; }\n        if (!/@/.test(s.email)) { this.toast('Please enter a valid work email'); return; }\n        this.setState({ submitted: true, companyEcho: s.company.trim(), emailEcho: s.email.trim() });\n
